name: Apply TV settings routing

on:
  push:
    branches:
      - agent/tv-settings-tv-first-no-apk
    paths:
      - .github/workflows/apply-tv-settings-routing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tv-settings-tv-first-no-apk
          fetch-depth: 1

      - name: Apply deterministic TV-only routing patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path("app/src/tv/java/app/ownplay/player/ui/TVOwnPlayApp.kt")
          text = app.read_text()
          old = "TVSection.SETTINGS -> SettingsScreen("
          new = "TVSection.SETTINGS -> TvSettingsScreen("
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one TV Settings route, found {text.count(old)}")
          app.write_text(text.replace(old, new, 1))

          screen = Path("app/src/tv/java/app/ownplay/player/ui/TvSettingsScreen.kt")
          text = screen.read_text()
          old = '''@Composable
          internal fun TvSettingsScreen(
              runtime: OwnPlayAppRuntime,
              summaries: List<PlaylistSourceSummary>,
              syncState: SourceSyncState,
              onOpenSourceInLive: (String) -> Unit,
          ) {'''
          new = '''@Suppress("UNUSED_PARAMETER")
          @Composable
          internal fun TvSettingsScreen(
              runtime: OwnPlayAppRuntime,
              summaries: List<PlaylistSourceSummary>,
              syncState: SourceSyncState,
              activeSourceName: String?,
              hasActivePlayback: Boolean,
              onOpenLive: () -> Unit,
              onOpenSourceInLive: (String) -> Unit,
              onStopPlayback: () -> Unit,
          ) {'''
          if text.count(old) != 1:
              raise SystemExit("TvSettingsScreen signature anchor changed")
          screen.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/apply-tv-settings-routing.yml
          git diff --check

      - name: Commit forward-only routing change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route TV Settings through dedicated presentation"
          git push origin HEAD:agent/tv-settings-tv-first-no-apk
