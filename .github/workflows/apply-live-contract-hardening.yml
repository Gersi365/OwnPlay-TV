name: Apply OwnPlay TV Live contract hardening

on:
  push:
    branches:
      - agent/live-contract-hardening-no-apk

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact Live phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/live-contract-hardening-no-apk
          fetch-depth: 0

      - name: Verify authorized base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7095974a8f94556b8d250aaf28bc52fa98d15d39"
          git diff --quiet 7095974a8f94556b8d250aaf28bc52fa98d15d39 HEAD^ -- app OwnPlay_TV_SOURCE.md OwnPlay_TV_UI_INTERACTION_CONTRACT.md OwnPlay_TV_ENGINEERING_WORKFLOW.md

      - name: Harden Live Preview Full View contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          shell = Path('app/src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt')
          replace_once(
              shell,
              '''                            onPlay = runtime.playbackController::play,\n                            onPause = runtime.playbackController::pause,\n                            onRetry = runtime.playbackController::retry,\n''',
              '',
              'remove Preview playback callbacks from LiveRoute call',
          )
          replace_once(
              shell,
              '''                            onPreviewRequested = { selection ->\n                                runtime.livePlaybackPresentationSession.showPreview(selection)\n                                runtime.playbackController.start(selection.request)\n                            },\n''',
              '''                            onPreviewRequested = { selection ->\n                                runtime.livePlaybackPresentationSession.showPreview(selection)\n                                runtime.playbackController.start(selection.request)\n                                liveTransitionGate.reconcileObserved(\n                                    LivePlaybackTransitionTarget.preview(selection),\n                                )\n                            },\n''',
              'synchronous Preview transition acknowledgement',
          )
          replace_once(
              shell,
              '''                            onNavigatePreview = { direction ->\n                                activeSelection\n                                    ?.navigate(direction)\n                                    ?.let { target ->\n                                        runtime.livePlaybackPresentationSession.replaceSelection(target)\n                                        runtime.playbackController.start(target.request)\n                                    }\n                            },\n''',
              '',
              'remove obsolete Preview navigation callback',
          )

          route = Path('app/src/main/java/app/ownplay/player/ui/LiveRoute.kt')
          text = route.read_text(encoding='utf-8')
          text = text.replace('import app.ownplay.player.playback.PlaybackNavigationDirection\n', '')
          for fragment in (
              '    onPlay: () -> Unit,\n',
              '    onPause: () -> Unit,\n',
              '    onRetry: () -> Unit,\n',
              '    onNavigatePreview: (PlaybackNavigationDirection) -> Unit,\n',
              '        onPlay = onPlay,\n',
              '        onPause = onPause,\n',
              '        onRetry = onRetry,\n',
              '        onNavigatePreview = onNavigatePreview,\n',
              '        onOpenFullscreen = onOpenFullscreen,\n',
              '        onPreviewClosed = onPreviewClosed,\n',
          ):
              if text.count(fragment) != 1:
                  raise RuntimeError(f'LiveRoute cleanup expected one match: {fragment!r}')
              text = text.replace(fragment, '', 1)
          route.write_text(text, encoding='utf-8')

          workspace = Path('app/src/main/java/app/ownplay/player/ui/live/TvLiveWorkspaceAdaptive.kt')
          text = workspace.read_text(encoding='utf-8')
          text = text.replace('import app.ownplay.player.playback.PlaybackNavigationDirection\n', '')
          text = text.replace(
              ' * Landscape Live shell with one consistent browse model across touch and TV layouts.\n',
              ' * TV-only Live workspace with one deterministic remote-first browse model.\n',
          )
          for fragment in (
              '    onPlay: () -> Unit,\n',
              '    onPause: () -> Unit,\n',
              '    onRetry: () -> Unit,\n',
              '    onNavigatePreview: (PlaybackNavigationDirection) -> Unit,\n',
              '    onOpenFullscreen: (LivePlaybackSelection) -> Unit,\n',
              '    onPreviewClosed: () -> Unit,\n',
              '                    onPlay = onPlay,\n',
              '                    onPause = onPause,\n',
              '                    onRetry = onRetry,\n',
              '                    onNavigate = onNavigatePreview,\n',
              '                    onOpenFullscreen = { onOpenFullscreen(preview) },\n',
              '                    onClose = onPreviewClosed,\n',
          ):
              if text.count(fragment) != 1:
                  raise RuntimeError(f'Workspace cleanup expected one match: {fragment!r}')
              text = text.replace(fragment, '', 1)
          replacements = {
              'LandscapeBrowseSurface': 'TvLiveBrowseSurface',
              'LandscapeLiveFocusZone': 'TvLiveFocusZone',
              'LandscapeLiveFocusAction': 'TvLiveFocusAction',
              'LandscapeLiveFocusPolicy': 'TvLiveFocusPolicy',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f'Missing legacy Live symbol: {old}')
              text = text.replace(old, new)
          workspace.write_text(text, encoding='utf-8')

          preview = Path('app/src/main/java/app/ownplay/player/ui/LivePreviewPanel.kt')
          text = preview.read_text(encoding='utf-8')
          text = text.replace('import app.ownplay.player.playback.PlaybackNavigationDirection\n', '')
          text = text.replace('@Suppress("UNUSED_PARAMETER")\n', '')
          for fragment in (
              '    onPlay: () -> Unit,\n',
              '    onPause: () -> Unit,\n',
              '    onRetry: () -> Unit,\n',
              '    onNavigate: (PlaybackNavigationDirection) -> Unit,\n',
              '    onOpenFullscreen: () -> Unit,\n',
              '    onClose: () -> Unit,\n',
          ):
              if text.count(fragment) != 1:
                  raise RuntimeError(f'Preview API cleanup expected one match: {fragment!r}')
              text = text.replace(fragment, '', 1)
          preview.write_text(text, encoding='utf-8')

          old_test = Path('app/src/test/java/app/ownplay/player/ui/live/LandscapeLiveFocusPolicyTest.kt')
          new_test = Path('app/src/test/java/app/ownplay/player/ui/live/TvLiveFocusPolicyTest.kt')
          if not old_test.is_file() or new_test.exists():
              raise RuntimeError('Focus policy test rename precondition failed')
          test_text = old_test.read_text(encoding='utf-8')
          for old, new in {
              'LandscapeLiveFocusPolicyTest': 'TvLiveFocusPolicyTest',
              'LandscapeLiveFocusZone': 'TvLiveFocusZone',
              'LandscapeLiveFocusAction': 'TvLiveFocusAction',
              'LandscapeLiveFocusPolicy': 'TvLiveFocusPolicy',
          }.items():
              test_text = test_text.replace(old, new)
          new_test.write_text(test_text, encoding='utf-8')
          old_test.unlink()

          lifecycle = Path('app/src/test/java/app/ownplay/player/LivePresentationLifecycleRegressionTest.kt')
          text = lifecycle.read_text(encoding='utf-8')
          marker = '''    @Test\n    fun transientSessionIsNotDiskBacked() {\n'''
          if text.count(marker) != 1:
              raise RuntimeError('Live lifecycle insertion marker missing')
          test = '''    @Test\n    fun rapidPreviewToFullscreenAcknowledgesPreviewBeforeSecondActivation() {\n        val source = sourceText("src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt")\n        val callback = source\n            .substringAfter("onPreviewRequested = { selection ->")\n            .substringBefore("onPreviewClosed =")\n\n        val showPreview = callback.indexOf("runtime.livePlaybackPresentationSession.showPreview(selection)")\n        val startPlayback = callback.indexOf("runtime.playbackController.start(selection.request)")\n        val acknowledgePreview = callback.indexOf("liveTransitionGate.reconcileObserved(")\n        val previewTarget = callback.indexOf("LivePlaybackTransitionTarget.preview(selection)")\n\n        assertTrue(showPreview >= 0)\n        assertTrue(showPreview < startPlayback)\n        assertTrue(startPlayback < acknowledgePreview)\n        assertTrue(acknowledgePreview < previewTarget)\n    }\n\n'''
          lifecycle.write_text(text.replace(marker, test + marker, 1), encoding='utf-8')

          preview_contract = Path('app/src/test/java/app/ownplay/player/ui/LivePreviewPresentationContractTest.kt')
          preview_contract.write_text('''package app.ownplay.player.ui\n\nimport app.ownplay.player.testing.sourceText\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass LivePreviewPresentationContractTest {\n    @Test\n    fun `preview is presentation only and cannot expose playback actions`() {\n        val preview = sourceText("src/main/java/app/ownplay/player/ui/LivePreviewPanel.kt")\n\n        assertTrue(preview.contains("useController = false"))\n        assertFalse(preview.contains("onPlay:"))\n        assertFalse(preview.contains("onPause:"))\n        assertFalse(preview.contains("onRetry:"))\n        assertFalse(preview.contains("onNavigate:"))\n        assertFalse(preview.contains("onOpenFullscreen:"))\n        assertFalse(preview.contains("onClose:"))\n        assertFalse(preview.contains("TextButton("))\n        assertFalse(preview.contains("IconButton("))\n    }\n\n    @Test\n    fun `live workspace is TV only with browse owned preview focus`() {\n        val workspace = sourceText("src/main/java/app/ownplay/player/ui/live/TvLiveWorkspaceAdaptive.kt")\n\n        assertTrue(workspace.contains("TvLiveFocusPolicy"))\n        assertTrue(workspace.contains("Preview is presentation-only"))\n        assertFalse(workspace.contains("LandscapeLive"))\n        assertFalse(workspace.contains("LandscapeBrowseSurface"))\n        assertFalse(workspace.contains("touch and TV"))\n    }\n}\n''', encoding='utf-8')

          provider_contract = Path('app/src/test/java/app/ownplay/player/live/LiveProviderCategoryContractTest.kt')
          provider_contract.write_text('''package app.ownplay.player.live\n\nimport app.ownplay.player.testing.sourceText\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass LiveProviderCategoryContractTest {\n    @Test\n    fun `content categories project directly from provider snapshot`() {\n        val source = sourceText("src/main/java/app/ownplay/player/live/LiveBrowseState.kt")\n\n        assertTrue(source.contains("cachedCategories = snapshot.categories"))\n        assertTrue(source.contains("categories = cachedCategories"))\n        assertTrue(source.contains("customGroups = cachedCustomGroups"))\n        assertTrue(source.contains("favoritesOnly = enabled"))\n    }\n}\n''', encoding='utf-8')
          PY

          git diff --check

          if grep -RInE 'LandscapeLive|LandscapeBrowseSurface|touch and TV' \
            app/src/main/java/app/ownplay/player/ui/LiveRoute.kt \
            app/src/main/java/app/ownplay/player/ui/LivePreviewPanel.kt \
            app/src/main/java/app/ownplay/player/ui/live \
            app/src/test/java/app/ownplay/player/ui/live; then
            echo 'Legacy Live form-factor terminology remains.' >&2
            exit 2
          fi
          if grep -RInE '"All"' \
            app/src/main/java/app/ownplay/player/ui/LiveRoute.kt \
            app/src/main/java/app/ownplay/player/ui/live \
            app/src/main/java/app/ownplay/player/ui/PlaybackScreen.kt; then
            echo 'Forbidden All label remains in active Live UI.' >&2
            exit 3
          fi
          grep -Fq 'cachedCategories = snapshot.categories' app/src/main/java/app/ownplay/player/live/LiveBrowseState.kt
          grep -Fq 'KEYCODE_CHANNEL_UP' app/src/main/java/app/ownplay/player/ui/PlaybackScreen.kt
          grep -Fq 'KEYCODE_CHANNEL_DOWN' app/src/main/java/app/ownplay/player/ui/PlaybackScreen.kt
          grep -Fq 'LivePlaybackTransitionTarget.preview(selection)' app/src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt

      - name: Remove runner and create exact candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-live-contract-hardening.yml
          git config user.name 'OwnPlay TV Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Live preview and fullscreen continuity'
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Validate exact candidate without APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          gradle \
            :app:kspDebugKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:compileDebugAndroidTestKotlin \
            --stacktrace

      - name: Verify zero APK and Room stability
        shell: bash
        run: |
          set -euo pipefail
          count="$(find app/build -type f -name '*.apk' -print 2>/dev/null | tee /tmp/ownplay-tv-apks.txt | wc -l)"
          echo "APK artifacts: ${count}"
          test "$count" -eq 0
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path('app/schemas')
          generated = sorted(root.rglob('*.json'))
          problems = []
          if not generated:
              problems.append('No Room schema JSON found.')
          for path in generated:
              relative = path.as_posix()
              committed = subprocess.check_output(['git', 'show', f'HEAD:{relative}'], text=True)
              if json.loads(path.read_text(encoding='utf-8')) != json.loads(committed):
                  problems.append(f'Room schema drift: {relative}')
          if problems:
              print('\n'.join(problems))
              sys.exit(7)
          print(f'Validated {len(generated)} committed Room schema files.')
          PY
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"

      - name: Push validated Live candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/live-contract-hardening-no-apk
          echo "Validated final HEAD: $FINAL_HEAD"
