name: Apply TV Settings focus and TV-only test patch

on:
  push:
    branches:
      - agent/tv-settings-tv-first-no-apk

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/tv-settings-tv-first-no-apk
          fetch-depth: 1

      - name: Apply deterministic TV-only corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # Playlist page: first meaningful action owns initial TV focus, not Back.
          path = 'app/src/main/java/app/ownplay/player/ui/SettingsPlaylist.kt'
          text = read(path)
          text = replace_once(
              text,
              '    focusBackOnEntry: Boolean = false,\n',
              '    focusPrimaryOnEntry: Boolean = false,\n',
              'playlist parameter',
          )
          text = replace_once(
              text,
              '    val backFocusRequester = remember { FocusRequester() }\n\n    LaunchedEffect(isTelevision, focusBackOnEntry) {\n        if (isTelevision && focusBackOnEntry) {\n            backFocusRequester.requestFocus()\n        }\n    }\n',
              '    val contentFocusRequester = remember { FocusRequester() }\n\n    LaunchedEffect(isTelevision, focusPrimaryOnEntry) {\n        if (isTelevision && focusPrimaryOnEntry) {\n            contentFocusRequester.requestFocus()\n        }\n    }\n',
              'playlist focus setup',
          )
          text = replace_once(
              text,
              '                TextButton(\n                    onClick = onBack,\n                    modifier = Modifier.focusRequester(backFocusRequester),\n                ) { Text("‹ Settings") }\n',
              '                TextButton(onClick = onBack) { Text("‹ Settings") }\n',
              'playlist back button',
          )
          text = replace_once(
              text,
              '                onOpenInLive = onOpenInLive,\n            )\n',
              '                onOpenInLive = onOpenInLive,\n                initialFocusRequester = contentFocusRequester,\n            )\n',
              'playlist screen focus requester',
          )
          write(path, text)

          # Shared playlist business UI: expose a deterministic focus hook on Add playlist.
          path = 'app/src/main/java/app/ownplay/player/ui/PlaylistSettingsScreen.kt'
          text = read(path)
          text = replace_once(
              text,
              'import androidx.compose.ui.Modifier\n',
              'import androidx.compose.ui.Modifier\nimport androidx.compose.ui.focus.FocusRequester\nimport androidx.compose.ui.focus.focusRequester\n',
              'playlist focus imports',
          )
          text = replace_once(
              text,
              '    syncState: SourceSyncState,\n    onOpenInLive: (String) -> Unit,\n) {\n',
              '    syncState: SourceSyncState,\n    onOpenInLive: (String) -> Unit,\n    initialFocusRequester: FocusRequester? = null,\n) {\n',
              'playlist screen signature',
          )
          text = replace_once(
              text,
              '            Button(onClick = { addMode = AddPlaylistMode.XTREAM }) {\n                Text("Add playlist")\n            }\n',
              '            Button(\n                onClick = { addMode = AddPlaylistMode.XTREAM },\n                modifier = if (initialFocusRequester != null) {\n                    Modifier.focusRequester(initialFocusRequester)\n                } else {\n                    Modifier\n                },\n            ) {\n                Text("Add playlist")\n            }\n',
              'playlist primary add button',
          )
          write(path, text)

          # Live Management: source selector is the deterministic first control on TV entry.
          path = 'app/src/main/java/app/ownplay/player/ui/LiveManagementScreen.kt'
          text = read(path)
          text = replace_once(
              text,
              '    focusBackOnEntry: Boolean = false,\n',
              '    focusPrimaryOnEntry: Boolean = false,\n',
              'live management parameter',
          )
          text = replace_once(
              text,
              '    val backFocusRequester = remember { FocusRequester() }\n',
              '    val backFocusRequester = remember { FocusRequester() }\n    val primaryFocusRequester = remember { FocusRequester() }\n',
              'live management focus requesters',
          )
          text = replace_once(
              text,
              '    LaunchedEffect(isTelevision, focusBackOnEntry, selectedSourceId) {\n        if (isTelevision && focusBackOnEntry) {\n            backFocusRequester.requestFocus()\n        }\n    }\n',
              '    LaunchedEffect(isTelevision, focusPrimaryOnEntry, selectedSourceId) {\n        if (isTelevision && focusPrimaryOnEntry) {\n            if (selectedSourceId == null) {\n                backFocusRequester.requestFocus()\n            } else {\n                primaryFocusRequester.requestFocus()\n            }\n        }\n    }\n',
              'live management initial focus',
          )
          text = replace_once(
              text,
              '            ManagementSourceMenu(\n                summaries = summaries,\n                selectedSourceId = selectedSourceId,\n                onSelected = { nextSourceId ->\n                    sourceId = nextSourceId\n                },\n            )\n',
              '            ManagementSourceMenu(\n                summaries = summaries,\n                selectedSourceId = selectedSourceId,\n                onSelected = { nextSourceId ->\n                    sourceId = nextSourceId\n                },\n                modifier = Modifier.focusRequester(primaryFocusRequester),\n            )\n',
              'live management source menu call',
          )
          text = replace_once(
              text,
              'private fun ManagementSourceMenu(\n    summaries: List<PlaylistSourceSummary>,\n    selectedSourceId: String,\n    onSelected: (String) -> Unit,\n) {\n',
              'private fun ManagementSourceMenu(\n    summaries: List<PlaylistSourceSummary>,\n    selectedSourceId: String,\n    onSelected: (String) -> Unit,\n    modifier: Modifier = Modifier,\n) {\n',
              'live management source menu signature',
          )
          text = replace_once(
              text,
              '        TextButton(onClick = { expanded = true }) {\n',
              '        TextButton(\n            onClick = { expanded = true },\n            modifier = modifier,\n        ) {\n',
              'live management source menu modifier',
          )
          write(path, text)

          # Backup/Restore: expose focus hook on first explicit action.
          path = 'app/src/main/java/app/ownplay/player/ui/BackupRestoreSettingsContent.kt'
          text = read(path)
          text = replace_once(
              text,
              'import androidx.compose.ui.Modifier\n',
              'import androidx.compose.ui.Modifier\nimport androidx.compose.ui.focus.FocusRequester\nimport androidx.compose.ui.focus.focusRequester\n',
              'backup focus imports',
          )
          text = replace_once(
              text,
              '@Composable\ninternal fun BackupRestoreSettingsContent() {\n',
              '@Composable\ninternal fun BackupRestoreSettingsContent(\n    initialFocusRequester: FocusRequester? = null,\n) {\n',
              'backup signature',
          )
          text = replace_once(
              text,
              '        SettingsActionRow(\n            title = "Backup personalization",\n            detail = "Personalization only · credentials excluded",\n            actionLabel = "Export",\n            onClick = { exportLauncher.launch("ownplay-personalization-v1.json") },\n        )\n',
              '        SettingsActionRow(\n            title = "Backup personalization",\n            detail = "Personalization only · credentials excluded",\n            actionLabel = "Export",\n            onClick = { exportLauncher.launch("ownplay-personalization-v1.json") },\n            modifier = if (initialFocusRequester != null) {\n                Modifier.focusRequester(initialFocusRequester)\n            } else {\n                Modifier\n            },\n        )\n',
              'backup primary action',
          )
          write(path, text)

          # TV Settings routing: request focus on subpage content instead of Back.
          path = 'app/src/tv/java/app/ownplay/player/ui/TvSettingsScreen.kt'
          text = read(path)
          text = text.replace('focusBackOnEntry = true,', 'focusPrimaryOnEntry = true,')
          if text.count('focusPrimaryOnEntry = true,') != 2:
              raise SystemExit('TV settings: expected two primary-focus subpages')
          text = replace_once(
              text,
              '        TvSettingsPage.BACKUP_RESTORE -> TvSettingsInformationPage(\n            title = "Backup & Restore",\n            subtitle = "Create or restore supported local personalization.",\n            onBack = { page = TvSettingsPage.ROOT },\n        ) {\n            BackupRestoreSettingsContent()\n        }\n',
              '        TvSettingsPage.BACKUP_RESTORE -> {\n            val backupFocusRequester = remember { FocusRequester() }\n            TvSettingsInformationPage(\n                title = "Backup & Restore",\n                subtitle = "Create or restore supported local personalization.",\n                onBack = { page = TvSettingsPage.ROOT },\n                initialContentFocusRequester = backupFocusRequester,\n            ) {\n                BackupRestoreSettingsContent(initialFocusRequester = backupFocusRequester)\n            }\n        }\n',
              'TV backup page focus',
          )
          text = replace_once(
              text,
              'private fun TvSettingsInformationPage(\n    title: String,\n    subtitle: String,\n    onBack: () -> Unit,\n    content: @Composable () -> Unit,\n) {\n',
              'private fun TvSettingsInformationPage(\n    title: String,\n    subtitle: String,\n    onBack: () -> Unit,\n    initialContentFocusRequester: FocusRequester? = null,\n    content: @Composable () -> Unit,\n) {\n',
              'TV information page signature',
          )
          text = replace_once(
              text,
              '    LaunchedEffect(Unit) {\n        backFocusRequester.requestFocus()\n    }\n',
              '    LaunchedEffect(initialContentFocusRequester) {\n        (initialContentFocusRequester ?: backFocusRequester).requestFocus()\n    }\n',
              'TV information page focus effect',
          )
          text = replace_once(
              text,
              '            TextButton(\n                onClick = onBack,\n                modifier = Modifier.focusRequester(backFocusRequester),\n            ) {\n',
              '            TextButton(\n                onClick = onBack,\n                modifier = if (initialContentFocusRequester == null) {\n                    Modifier.focusRequester(backFocusRequester)\n                } else {\n                    Modifier\n                },\n            ) {\n',
              'TV information page back focus attachment',
          )
          write(path, text)

          # TV-only repository migration: legacy contract tests must no longer require src/mobile.
          path = 'app/src/test/java/app/ownplay/player/LivePresentationLifecycleRegressionTest.kt'
          text = read(path)
          text = replace_once(
              text,
              '    fun mobileAndTvReadLivePresentationFromProcessScopedSession() {\n',
              '    fun tvReadsLivePresentationFromProcessScopedSession() {\n',
              'live lifecycle test name',
          )
          text = replace_once(
              text,
              '        val shellPaths = listOf(\n            "src/mobile/java/app/ownplay/player/ui/MobileOwnPlayApp.kt",\n            "src/tv/java/app/ownplay/player/ui/TVOwnPlayApp.kt",\n        )\n',
              '        val shellPaths = listOf(\n            "src/tv/java/app/ownplay/player/ui/TVOwnPlayApp.kt",\n        )\n',
              'live lifecycle TV-only paths',
          )
          write(path, text)

          path = 'app/src/test/java/app/ownplay/player/ShellLifecycleRegressionTest.kt'
          text = read(path)
          text = text.replace('mobileAndTvActiveSourceHelpersPersistAndDoNotRecurse', 'tvActiveSourceHelperPersistsAndDoesNotRecurse')
          text = text.replace('mobileAndTvWaitForPersistedSelectionBeforeResolvingFallback', 'tvWaitsForPersistedSelectionBeforeResolvingFallback')
          text = text.replace('mobileAndTvLiveSyncStatusIsScopedToDisplayedSource', 'tvLiveSyncStatusIsScopedToDisplayedSource')
          text = text.replace('mobileAndTvBackHierarchyFallsThroughToExitOnlyAtLiveRoot', 'tvBackHierarchyFallsThroughToExitOnlyAtLiveRoot')
          text = replace_once(
              text,
              '        listOf(\n            "src/mobile/java/app/ownplay/player/ui/TargetLiveRoute.kt",\n            "src/tv/java/app/ownplay/player/ui/LiveRoute.kt",\n        ).forEach { path ->\n',
              '        listOf(\n            "src/tv/java/app/ownplay/player/ui/LiveRoute.kt",\n        ).forEach { path ->\n',
              'shell live route TV-only paths',
          )
          text = replace_once(
              text,
              '        listOf(\n            "src/mobile/java/app/ownplay/player/ui/MobileOwnPlayApp.kt" to "MobileSection",\n            "src/tv/java/app/ownplay/player/ui/TVOwnPlayApp.kt" to "TVSection",\n        ).forEach { (path, sectionType) ->\n',
              '        listOf(\n            "src/tv/java/app/ownplay/player/ui/TVOwnPlayApp.kt" to "TVSection",\n        ).forEach { (path, sectionType) ->\n',
              'shell back hierarchy TV-only paths',
          )
          text = replace_once(
              text,
              '        val activeShellPaths = listOf(\n            "src/mobile/java/app/ownplay/player/ui/MobileOwnPlayApp.kt",\n            "src/tv/java/app/ownplay/player/ui/TVOwnPlayApp.kt",\n        )\n',
              '        val activeShellPaths = listOf(\n            "src/tv/java/app/ownplay/player/ui/TVOwnPlayApp.kt",\n        )\n',
              'shell active TV-only paths',
          )
          write(path, text)

          path = 'app/src/test/java/app/ownplay/player/playback/OnDemandPresentationLifecycleRegressionTest.kt'
          text = read(path)
          text = replace_once(
              text,
              '    fun mobileAndTvShellsRestoreOnDemandRouteFromProcessSession() {\n        val mobile = sourceText("src/mobile/java/app/ownplay/player/ui/MobileOwnPlayApp.kt")\n        val tv = sourceText("src/tv/java/app/ownplay/player/ui/TVOwnPlayApp.kt")\n\n        listOf(mobile, tv).forEach { shell ->\n',
              '    fun tvShellRestoresOnDemandRouteFromProcessSession() {\n        val tv = sourceText("src/tv/java/app/ownplay/player/ui/TVOwnPlayApp.kt")\n\n        listOf(tv).forEach { shell ->\n',
              'on-demand lifecycle TV-only shell',
          )
          write(path, text)

          # Focused Settings contract test: assert enum order rather than unrelated later title strings.
          path = 'app/src/test/java/app/ownplay/player/ui/TvSettingsPresentationContractTest.kt'
          text = read(path)
          old = '''    @Test\n    fun tvRootContainsOnlyApprovedDestinationsInOrder() {\n        val playlists = tvSettingsSource.indexOf("title = \\\"Playlists\\\"")\n        val liveManagement = tvSettingsSource.indexOf("title = \\\"Live Management\\\"")\n        val backupRestore = tvSettingsSource.indexOf("title = \\\"Backup & Restore\\\"")\n        val about = tvSettingsSource.indexOf("title = \\\"About\\\"")\n\n        assertTrue(playlists >= 0)\n        assertTrue(playlists < liveManagement)\n        assertTrue(liveManagement < backupRestore)\n        assertTrue(backupRestore < about)\n        assertFalse(tvSettingsSource.contains("title = \\\"Interface\\\""))\n        assertFalse(tvSettingsSource.contains("title = \\\"Downloads\\\""))\n    }\n'''
          new = '''    @Test\n    fun tvRootContainsOnlyApprovedDestinationsInOrder() {\n        assertTrue(\n            tvSettingsSource.contains(\n                "private enum class TvSettingsDestination {\\n" +\n                    "    PLAYLISTS,\\n" +\n                    "    LIVE_MANAGEMENT,\\n" +\n                    "    BACKUP_RESTORE,\\n" +\n                    "    ABOUT,\\n" +\n                    "}",\n            ),\n        )\n        assertTrue(tvSettingsSource.contains("title = \\\"Playlists\\\""))\n        assertTrue(tvSettingsSource.contains("title = \\\"Live Management\\\""))\n        assertTrue(tvSettingsSource.contains("title = \\\"Backup & Restore\\\""))\n        assertTrue(tvSettingsSource.contains("title = \\\"About\\\""))\n        assertFalse(tvSettingsSource.contains("title = \\\"Interface\\\""))\n        assertFalse(tvSettingsSource.contains("title = \\\"Downloads\\\""))\n    }\n'''
          text = replace_once(text, old, new, 'TV settings destination-order test')
          marker = '''    @Test\n    fun rootUsesDedicatedSubpagesForAllApprovedDestinations() {\n'''
          addition = '''    @Test\n    fun tvSubpagesFocusMeaningfulContentInsteadOfBackOnEntry() {\n        assertTrue(tvSettingsSource.contains("focusPrimaryOnEntry = true"))\n        assertTrue(tvSettingsSource.contains("BackupRestoreSettingsContent(initialFocusRequester = backupFocusRequester)"))\n        assertTrue(tvSettingsSource.contains("(initialContentFocusRequester ?: backFocusRequester).requestFocus()"))\n    }\n\n'''
          if marker not in text:
              raise SystemExit('TV settings test insertion marker missing')
          text = text.replace(marker, addition + marker, 1)
          write(path, text)
          PY

          rm -f .github/workflows/apply-tv-settings-focus-and-tests.yml
          git status --short

      - name: Commit deterministic corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix TV Settings focus and TV-only regression tests'
          git push origin HEAD:agent/tv-settings-tv-first-no-apk
