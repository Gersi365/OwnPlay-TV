name: Bootstrap OwnPlay TV source

on:
  push:
    paths:
      - .github/workflows/bootstrap-tv-source.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 1

      - name: Checkout authoritative source checkpoint
        uses: actions/checkout@v4
        with:
          repository: Gersi365/ownplay
          ref: ce128932ff6eb9e7e812fc428fabb40306603b34
          path: source
          persist-credentials: false

      - name: Copy TV and shared source only
        shell: bash
        run: |
          set -euo pipefail

          install -m 0644 source/.editorconfig target/.editorconfig
          install -m 0644 source/.gitignore target/.gitignore
          install -m 0644 source/build.gradle.kts target/build.gradle.kts
          install -m 0644 source/gradle.properties target/gradle.properties
          install -m 0644 source/settings.gradle.kts target/settings.gradle.kts

          rm -rf target/app
          mkdir -p target/app
          rsync -a --delete \
            --exclude 'src/mobile/' \
            --exclude 'src/testMobile/' \
            source/app/ target/app/

          rm -f target/.github/workflows/bootstrap-tv-source.yml

          test -f target/app/src/tv/java/app/ownplay/player/ui/TVOwnPlayApp.kt
          test -f target/app/src/tv/java/app/ownplay/player/ui/TargetOwnPlayApp.kt
          test ! -d target/app/src/mobile
          test ! -d target/app/src/testMobile

      - name: Record forward-only migration commit
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Migrate authoritative OwnPlay TV source"
          git push origin HEAD:main
