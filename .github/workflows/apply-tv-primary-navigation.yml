name: Apply OwnPlay TV primary navigation

on:
  push:
    branches:
      - agent/tv-only-foundation

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v6
        with:
          ref: agent/tv-only-foundation
          fetch-depth: 0

      - name: Verify authorized base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9fcc43684b47a20d8155ae57f8bd8cb21fc06572"

      - name: Migrate production shell to approved TV rail
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          def replace_between(start_marker: str, end_marker: str, replacement: str, label: str) -> None:
              global text
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f'{label}: start marker missing')
              end = text.find(end_marker, start)
              if end < 0:
                  raise RuntimeError(f'{label}: end marker missing')
              text = text[:start] + replacement + text[end:]

          replace_once(
              'import androidx.compose.foundation.background\n',
              'import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\n',
              'border import',
          )
          replace_once(
              'import androidx.compose.foundation.layout.Row\n',
              'import androidx.compose.foundation.layout.Row\nimport androidx.compose.foundation.layout.Spacer\n',
              'spacer import',
          )
          replace_once(
              'import androidx.compose.foundation.layout.fillMaxSize\n',
              'import androidx.compose.foundation.layout.fillMaxHeight\nimport androidx.compose.foundation.layout.fillMaxSize\n',
              'fill max height import',
          )
          replace_once(
              'import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.widthIn\n',
              'import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.size\nimport androidx.compose.foundation.layout.width\nimport androidx.compose.foundation.layout.weight\n',
              'fixed rail geometry imports',
          )
          replace_once(
              'import androidx.compose.foundation.shape.RoundedCornerShape\n',
              'import androidx.compose.foundation.focusGroup\nimport androidx.compose.foundation.shape.RoundedCornerShape\n',
              'focus group import',
          )
          replace_once(
              'import androidx.compose.material.icons.filled.LiveTv\n',
              'import androidx.compose.material.icons.filled.LiveTv\nimport androidx.compose.material.icons.filled.Movie\nimport androidx.compose.material.icons.filled.PlayArrow\n',
              'approved rail icon imports',
          )
          text = text.replace('import androidx.compose.material3.Scaffold\n', '')
          replace_once(
              'import androidx.compose.ui.focus.onFocusChanged\n',
              'import androidx.compose.ui.focus.FocusDirection\nimport androidx.compose.ui.focus.onFocusChanged\n',
              'focus direction import',
          )
          replace_once(
              'import androidx.compose.ui.graphics.vector.ImageVector\n',
              'import androidx.compose.ui.graphics.vector.ImageVector\nimport androidx.compose.ui.input.key.Key\nimport androidx.compose.ui.input.key.KeyEventType\nimport androidx.compose.ui.input.key.onPreviewKeyEvent\n',
              'rail key imports',
          )
          replace_once(
              'import androidx.compose.ui.platform.LocalContext\n',
              'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalFocusManager\n',
              'focus manager import',
          )
          text = text.replace('import app.ownplay.player.ui.library.UnifiedLibraryRoute\n', '')

          replace_once(
              '''private enum class TVSection {\n    LIVE,\n    LIBRARY,\n    MOVIES,\n    SERIES,\n    SETTINGS,\n}\n''',
              '''private enum class TVSection {\n    LIVE,\n    MOVIES,\n    SERIES,\n    SETTINGS,\n}\n''',
              'global destination enum',
          )
          replace_once(
              ''' * Primary navigation exposes Live / Library / Settings only. Movies and Series are internal\n * Library routes. The TV configuration boundary makes D-pad/TV presentation deterministic and\n * prevents shared presentation components from exposing Mobile-only Offline/Download UI.\n''',
              ''' * Primary navigation exposes Live / Movies / Series / Settings as a fixed icon-only rail.\n * The shell keeps global navigation geometry stable while page-specific routes retain ownership of\n * their own nested Back/focus restoration behavior.\n''',
              'shell documentation',
          )

          replace_between(
              '    var movieDetailReturnToLibrary by remember {\n',
              '    var libraryFullscreen by remember { mutableStateOf(false) }\n',
              '',
              'obsolete library return state',
          )
          text = text.replace('    var libraryFullscreen by remember { mutableStateOf(false) }\n', '')

          replace_once(
              '''        if (target != TVSection.MOVIES) {\n            requestedVodMovieId = null\n            movieDetailReturnToLibrary = false\n        }\n        if (target != TVSection.SERIES) {\n            requestedSeriesId = null\n            seriesDetailReturnToLibrary = false\n        }\n''',
              '''        if (target != TVSection.MOVIES) {\n            requestedVodMovieId = null\n        }\n        if (target != TVSection.SERIES) {\n            requestedSeriesId = null\n        }\n''',
              'section cleanup state',
          )

          replace_between(
              '    BackHandler(enabled = section != TVSection.LIVE) {\n',
              '    LaunchedEffect(summaries, activePlaylistSelection, disabledSourceIds) {\n',
              '''    BackHandler(enabled = section != TVSection.LIVE) {\n        val interactionHandled = when (section) {\n            TVSection.MOVIES,\n            TVSection.SERIES,\n            -> PlaybackInteractionBridge.handleBack()\n            TVSection.LIVE,\n            TVSection.SETTINGS,\n            -> false\n        }\n        if (interactionHandled) return@BackHandler\n\n        when (section) {\n            TVSection.MOVIES,\n            TVSection.SERIES,\n            TVSection.SETTINGS,\n            -> openSection(TVSection.LIVE)\n            TVSection.LIVE -> Unit\n        }\n    }\n\n''',
              'top-level back routing',
          )

          replace_once(
              '''        if (resolvedSourceId == null) {\n            requestedVodMovieId = null\n            requestedSeriesId = null\n            movieDetailReturnToLibrary = false\n            seriesDetailReturnToLibrary = false\n        }\n''',
              '''        if (resolvedSourceId == null) {\n            requestedVodMovieId = null\n            requestedSeriesId = null\n        }\n''',
              'source reset state',
          )

          presentation = '''    val hidePrimaryNavigation = vodFullscreen || seriesFullscreen\n\n    Box(\n        modifier = Modifier\n            .fillMaxSize()\n            .background(MaterialTheme.colorScheme.background),\n    ) {\n        Box(\n            modifier = Modifier\n                .fillMaxSize()\n                .padding(start = if (hidePrimaryNavigation) 0.dp else 82.dp),\n        ) {\n            when (section) {\n                TVSection.LIVE -> {\n                    val sourceId = activeSourceId\n                    if (sourceId == null) {\n                        TVNoSourceScreen(\n                            syncState = syncState,\n                            onAddPlaylist = { openSection(TVSection.SETTINGS) },\n                            modifier = Modifier.fillMaxSize(),\n                        )\n                    } else {\n                        LiveRoute(\n                            runtime = runtime,\n                            sourceId = sourceId,\n                            activeSelection = activeSelection,\n                            playbackState = playbackState,\n                            videoOutput = runtime.playbackVideoOutput,\n                            syncState = syncState,\n                            onPlay = runtime.playbackController::play,\n                            onPause = runtime.playbackController::pause,\n                            onRetry = runtime.playbackController::retry,\n                            onOpenMovies = { openSection(TVSection.MOVIES) },\n                            onOpenSeries = { openSection(TVSection.SERIES) },\n                            onOpenSettings = { openSection(TVSection.SETTINGS) },\n                            onPreviewRequested = { selection ->\n                                runtime.livePlaybackPresentationSession.showPreview(selection)\n                                runtime.playbackController.start(selection.request)\n                            },\n                            onPreviewClosed = {\n                                stopLivePresentation {\n                                    runtime.livePlaybackPresentationSession.clear()\n                                }\n                            },\n                            onOpenFullscreen = { selection ->\n                                openLiveFullscreen(activeSelection ?: selection)\n                            },\n                            onNavigatePreview = { direction ->\n                                activeSelection\n                                    ?.navigate(direction)\n                                    ?.let { target ->\n                                        runtime.livePlaybackPresentationSession.replaceSelection(target)\n                                        runtime.playbackController.start(target.request)\n                                    }\n                            },\n                        )\n                    }\n                }\n\n                TVSection.MOVIES -> VodRoute(\n                    runtime = runtime,\n                    sourceId = activeSourceId,\n                    sourceKind = activeSummary?.sourceKind,\n                    requestedMovieId = requestedVodMovieId,\n                    onRequestedMovieConsumed = { requestedVodMovieId = null },\n                    onOpenLive = { openSection(TVSection.LIVE) },\n                    onOpenSeries = { openSection(TVSection.SERIES) },\n                    onOpenSettings = { openSection(TVSection.SETTINGS) },\n                    onFullscreenStateChanged = onPlaybackFullscreenChanged,\n                )\n\n                TVSection.SERIES -> SeriesRoute(\n                    runtime = runtime,\n                    sourceId = activeSourceId,\n                    sourceKind = activeSummary?.sourceKind,\n                    requestedSeriesId = requestedSeriesId,\n                    onRequestedSeriesConsumed = { requestedSeriesId = null },\n                    onOpenSettings = { openSection(TVSection.SETTINGS) },\n                    onFullscreenStateChanged = onPlaybackFullscreenChanged,\n                )\n\n                TVSection.SETTINGS -> TvSettingsScreen(\n                    runtime = runtime,\n                    summaries = summaries,\n                    disabledSourceIds = disabledSourceIds,\n                    onSetSourceEnabled = { sourceId, enabled ->\n                        activePlaylistScope.launch {\n                            playlistAvailabilityStore.setEnabled(sourceId, enabled)\n                        }\n                    },\n                    syncState = syncState,\n                    activeSourceName = activeSummary?.name,\n                    hasActivePlayback =\n                        activeSelection != null ||\n                            vodFullscreen ||\n                            seriesFullscreen,\n                    onOpenLive = { openSection(TVSection.LIVE) },\n                    onOpenSourceInLive = { sourceId ->\n                        if (sourceId != activeSourceId && activeSelection != null) {\n                            stopLivePresentation {\n                                runtime.livePlaybackPresentationSession.clear()\n                            }\n                        }\n                        rememberActiveSource(sourceId)\n                        runtime.onDemandPresentationSession.clear()\n                        section = TVSection.LIVE\n                    },\n                    onStopPlayback = {\n                        if (activeSelection != null || fullscreenSelection != null) {\n                            stopLivePresentation {\n                                runtime.livePlaybackPresentationSession.clear()\n                            }\n                        } else {\n                            runtime.playbackController.stop()\n                            runtime.onDemandPresentationSession.clear()\n                        }\n                    },\n                )\n            }\n        }\n\n        if (!hidePrimaryNavigation) {\n            TVPrimaryNavigationRail(\n                selected = section,\n                onOpenLive = { openSection(TVSection.LIVE) },\n                onOpenMovies = { openSection(TVSection.MOVIES) },\n                onOpenSeries = { openSection(TVSection.SERIES) },\n                onOpenSettings = { openSection(TVSection.SETTINGS) },\n            )\n        }\n    }\n}\n\n'''
          replace_between(
              '    val librarySectionActive =\n',
              '@Composable\nprivate fun TVPrimaryNavigationBar(',
              presentation,
              'production destination rendering',
          )

          rail = '''@Composable\nprivate fun TVPrimaryNavigationRail(\n    selected: TVSection,\n    onOpenLive: () -> Unit,\n    onOpenMovies: () -> Unit,\n    onOpenSeries: () -> Unit,\n    onOpenSettings: () -> Unit,\n) {\n    Column(\n        modifier = Modifier\n            .width(82.dp)\n            .fillMaxHeight()\n            .background(MaterialTheme.colorScheme.surface.copy(alpha = 0.96f))\n            .border(1.dp, MaterialTheme.colorScheme.outline.copy(alpha = 0.42f))\n            .padding(vertical = 24.dp)\n            .focusGroup(),\n        horizontalAlignment = Alignment.CenterHorizontally,\n    ) {\n        Box(\n            modifier = Modifier\n                .size(46.dp)\n                .background(\n                    MaterialTheme.colorScheme.primary,\n                    RoundedCornerShape(12.dp),\n                ),\n            contentAlignment = Alignment.Center,\n        ) {\n            Icon(\n                imageVector = Icons.Filled.PlayArrow,\n                contentDescription = "OwnPlay",\n                tint = Color.White,\n                modifier = Modifier.size(30.dp),\n            )\n        }\n\n        Spacer(Modifier.weight(1f))\n\n        Column(\n            verticalArrangement = Arrangement.spacedBy(14.dp),\n            horizontalAlignment = Alignment.CenterHorizontally,\n        ) {\n            TVPrimaryNavigationItem(\n                label = "Live",\n                icon = Icons.Filled.LiveTv,\n                selected = selected == TVSection.LIVE,\n                onClick = onOpenLive,\n            )\n            TVPrimaryNavigationItem(\n                label = "Movies",\n                icon = Icons.Filled.Movie,\n                selected = selected == TVSection.MOVIES,\n                onClick = onOpenMovies,\n            )\n            TVPrimaryNavigationItem(\n                label = "Series",\n                icon = Icons.Filled.VideoLibrary,\n                selected = selected == TVSection.SERIES,\n                onClick = onOpenSeries,\n            )\n            TVPrimaryNavigationItem(\n                label = "Settings",\n                icon = Icons.Filled.Settings,\n                selected = selected == TVSection.SETTINGS,\n                onClick = onOpenSettings,\n            )\n        }\n\n        Spacer(Modifier.weight(1f))\n\n        Text(\n            text = "TV",\n            style = MaterialTheme.typography.labelSmall,\n            color = MaterialTheme.colorScheme.onSurfaceVariant,\n        )\n    }\n}\n\n@Composable\nprivate fun TVPrimaryNavigationItem(\n    label: String,\n    icon: ImageVector,\n    selected: Boolean,\n    onClick: () -> Unit,\n) {\n    var focused by remember(label) { mutableStateOf(false) }\n    val focusManager = LocalFocusManager.current\n    val shape = RoundedCornerShape(12.dp)\n    val borderColor = when {\n        focused -> MaterialTheme.colorScheme.primary\n        selected -> MaterialTheme.colorScheme.primary.copy(alpha = 0.72f)\n        else -> MaterialTheme.colorScheme.outline\n    }\n    val backgroundColor = when {\n        focused -> MaterialTheme.colorScheme.primaryContainer\n        selected -> MaterialTheme.colorScheme.surfaceVariant\n        else -> MaterialTheme.colorScheme.surface\n    }\n\n    Box(\n        modifier = Modifier\n            .size(52.dp)\n            .border(2.dp, borderColor, shape)\n            .background(backgroundColor, shape)\n            .onFocusChanged { focused = it.isFocused }\n            .onPreviewKeyEvent { event ->\n                if (event.type != KeyEventType.KeyDown) {\n                    false\n                } else {\n                    when (event.key) {\n                        Key.DirectionLeft -> true\n                        Key.DirectionRight -> focusManager.moveFocus(FocusDirection.Right)\n                        else -> false\n                    }\n                }\n            }\n            .clickable(onClick = onClick),\n        contentAlignment = Alignment.Center,\n    ) {\n        Icon(\n            imageVector = icon,\n            contentDescription = label,\n            tint = when {\n                focused -> MaterialTheme.colorScheme.onPrimaryContainer\n                selected -> MaterialTheme.colorScheme.primary\n                else -> MaterialTheme.colorScheme.onSurfaceVariant\n            },\n            modifier = Modifier.size(24.dp),\n        )\n    }\n}\n\n'''
          replace_between(
              '@Composable\nprivate fun TVPrimaryNavigationBar(',
              '@Composable\nprivate fun TVNoSourceScreen(',
              rail,
              'approved primary rail',
          )

          forbidden = (
              'TVSection.LIBRARY',
              'TVPrimaryNavigationBar',
              'onOpenLibrary',
              'librarySelected',
              'librarySectionActive',
              'libraryFullscreen',
              'movieDetailReturnToLibrary',
              'seriesDetailReturnToLibrary',
              'UnifiedLibraryRoute',
              'Scaffold(',
          )
          leftovers = [token for token in forbidden if token in text]
          if leftovers:
              raise RuntimeError(f'Obsolete global navigation residue remains: {leftovers}')

          for label in ('label = "Live"', 'label = "Movies"', 'label = "Series"', 'label = "Settings"'):
              if text.count(label) != 1:
                  raise RuntimeError(f'Expected one primary rail item for {label}')
          if 'Text(\n                text = label' in text or 'Text(text = label' in text:
              raise RuntimeError('Primary rail must remain icon-only')

          path.write_text(text, encoding='utf-8')

          test_path = Path('app/src/test/java/app/ownplay/player/ui/TvPrimaryNavigationContractTest.kt')
          test_path.write_text('''package app.ownplay.player.ui\n\nimport app.ownplay.player.testing.sourceText\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass TvPrimaryNavigationContractTest {\n    private val shell = sourceText("src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt")\n\n    @Test\n    fun `global destinations are Live Movies Series Settings with no Library destination`() {\n        assertTrue(shell.contains("LIVE,\\n    MOVIES,\\n    SERIES,\\n    SETTINGS,"))\n        assertFalse(shell.contains("TVSection.LIBRARY"))\n        assertFalse(shell.contains("onOpenLibrary"))\n        assertFalse(shell.contains("label = \\\"Library\\\""))\n    }\n\n    @Test\n    fun `primary navigation is a fixed icon only left rail`() {\n        assertTrue(shell.contains("private fun TVPrimaryNavigationRail("))\n        assertTrue(shell.contains(".width(82.dp)"))\n        assertTrue(shell.contains(".size(52.dp)"))\n        assertTrue(shell.contains(".border(2.dp, borderColor, shape)"))\n        assertTrue(shell.contains("contentDescription = label"))\n        assertFalse(shell.contains("Text(text = label"))\n        assertFalse(shell.contains("TVPrimaryNavigationBar"))\n        assertFalse(shell.contains("Scaffold("))\n    }\n\n    @Test\n    fun `rail order matches the durable TV contract`() {\n        val live = shell.indexOf("label = \\\"Live\\\"")\n        val movies = shell.indexOf("label = \\\"Movies\\\"")\n        val series = shell.indexOf("label = \\\"Series\\\"")\n        val settings = shell.indexOf("label = \\\"Settings\\\"")\n\n        assertTrue(live >= 0)\n        assertTrue(live < movies)\n        assertTrue(movies < series)\n        assertTrue(series < settings)\n    }\n\n    @Test\n    fun `top level Back never routes through Library`() {\n        assertTrue(shell.contains("TVSection.SETTINGS,\\n            -> openSection(TVSection.LIVE)"))\n        assertFalse(shell.contains("openSection(TVSection.LIBRARY)"))\n    }\n}\n''', encoding='utf-8')
          PY

          git diff --check
          grep -Fq 'Primary navigation is:' OwnPlay_TV_SOURCE.md
          grep -Fq -- '- **Movies**' OwnPlay_TV_SOURCE.md
          grep -Fq -- '- **Series**' OwnPlay_TV_SOURCE.md
          test -f app/src/test/java/app/ownplay/player/ui/TvPrimaryNavigationContractTest.kt
          if grep -nE 'TVSection\.LIBRARY|onOpenLibrary|label = "Library"|TVPrimaryNavigationBar|Scaffold\(' app/src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt; then
            echo 'Obsolete global navigation remains in production shell.' >&2
            exit 2
          fi

      - name: Remove temporary runner and create candidate commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-tv-primary-navigation.yml
          git config user.name 'OwnPlay TV Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Move primary navigation to TV rail'
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Validate exact candidate without APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          gradle \
            :app:kspDebugKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:compileDebugAndroidTestKotlin \
            --stacktrace

      - name: Verify zero APK and Room stability
        shell: bash
        run: |
          set -euo pipefail
          count="$(find app/build -type f -name '*.apk' -print 2>/dev/null | tee /tmp/ownplay-tv-apks.txt | wc -l)"
          echo "APK artifacts: ${count}"
          test "$count" -eq 0
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path('app/schemas')
          problems = []
          generated = sorted(root.rglob('*.json'))
          if not generated:
              problems.append('No Room schema JSON found.')
          for path in generated:
              relative = path.as_posix()
              committed = subprocess.check_output(['git', 'show', f'HEAD:{relative}'], text=True)
              if json.loads(path.read_text(encoding='utf-8')) != json.loads(committed):
                  problems.append(f'Room schema drift: {relative}')
          if problems:
              print('\n'.join(problems))
              sys.exit(7)
          print(f'Validated {len(generated)} committed Room schema files.')
          PY
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"

      - name: Push validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/tv-only-foundation
          echo "Validated final HEAD: $FINAL_HEAD"
