name: Apply OwnPlay TV Movies contract hardening

on:
  push:
    branches:
      - agent/movies-tv-contract-hardening-no-apk

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact Movies phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/movies-tv-contract-hardening-no-apk
          fetch-depth: 0

      - name: Verify authorized base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c18b646391e0d7d01d43de96e2dc0531ecbf2849"
          git diff --quiet c18b646391e0d7d01d43de96e2dc0531ecbf2849 HEAD^ -- app OwnPlay_TV_SOURCE.md OwnPlay_TV_UI_INTERACTION_CONTRACT.md OwnPlay_TV_ENGINEERING_WORKFLOW.md

      - name: Harden Movies TV contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          route = Path('app/src/main/java/app/ownplay/player/ui/vod/VodRoute.kt')
          text = route.read_text(encoding='utf-8')
          text = text.replace(
              'import androidx.compose.foundation.background\n',
              'import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\n',
              1,
          )
          text = text.replace(
              'import androidx.compose.ui.focus.focusRequester\n',
              'import androidx.compose.ui.focus.focusRequester\nimport androidx.compose.ui.focus.onFocusChanged\n',
              1,
          )

          old = '''    var restoreDetailFocusAfterPlayback by remember(sourceId) { mutableStateOf(false) }\n    var restoreCategoryFocusAfterDetailBack by remember(sourceId) { mutableStateOf(false) }\n'''
          new = '''    var restoreDetailFocusAfterPlayback by remember(sourceId) { mutableStateOf(false) }\n    var restoreCategoryFocusAfterDetailBack by remember(sourceId) { mutableStateOf(false) }\n    var selectedMovieFocusOrigin by remember(sourceId) { mutableStateOf<MovieFocusOrigin?>(null) }\n    var restoreMovieFocusTarget by remember(sourceId) { mutableStateOf<MovieFocusTarget?>(null) }\n'''
          if text.count(old) != 1:
              raise RuntimeError('Movies focus state block mismatch')
          text = text.replace(old, new, 1)

          old = '''    fun closeMovieDetails() {\n        restoreDetailFocusAfterPlayback = false\n        if (returnToLibraryOnDetailBack) {\n            runtime.onDemandPresentationSession.clear()\n            onReturnToLibrary()\n            return\n        }\n        restoreCategoryFocusAfterDetailBack = true\n        selectedMovie = null\n        runtime.onDemandPresentationSession.showMovieCatalog(sourceId)\n    }\n'''
          new = '''    fun closeMovieDetails() {\n        restoreDetailFocusAfterPlayback = false\n        if (returnToLibraryOnDetailBack) {\n            runtime.onDemandPresentationSession.clear()\n            onReturnToLibrary()\n            return\n        }\n        restoreCategoryFocusAfterDetailBack = false\n        restoreMovieFocusTarget = selectedMovie?.let { movie ->\n            selectedMovieFocusOrigin?.let { origin -> MovieFocusTarget(movie.movieId, origin) }\n        }\n        selectedMovieFocusOrigin = null\n        selectedMovie = null\n        runtime.onDemandPresentationSession.showMovieCatalog(sourceId)\n    }\n'''
          if text.count(old) != 1:
              raise RuntimeError('Movie detail Back block mismatch')
          text = text.replace(old, new, 1)

          old = '''        restoreDetailFocusAfterPlayback = false\n        restoreCategoryFocusAfterDetailBack = false\n        selectedMovie = target\n'''
          new = '''        restoreDetailFocusAfterPlayback = false\n        restoreCategoryFocusAfterDetailBack = false\n        selectedMovieFocusOrigin = null\n        restoreMovieFocusTarget = null\n        selectedMovie = target\n'''
          if text.count(old) != 1:
              raise RuntimeError('Requested movie focus reset block mismatch')
          text = text.replace(old, new, 1)

          marker = '''    fun refresh() {\n'''
          if text.count(marker) != 1:
              raise RuntimeError('Movie playback helper insertion marker mismatch')
          helper = '''    fun startMoviePlayback(target: VodMovie, fromBeginning: Boolean) {\n        restoreDetailFocusAfterPlayback = false\n        runtime.playbackController.start(\n            PlaybackRequest(\n                sourceId = sourceId,\n                channelId = target.movieId,\n                mediaKind = PlaybackMediaKind.MOVIE,\n            ),\n        )\n        runtime.onDemandPresentationSession.showMoviePlayback(\n            sourceId = sourceId,\n            movie = moviePlaybackSnapshot(target, fromBeginning),\n            returnToLibraryOnDetailBack = returnToLibraryOnDetailBack,\n        )\n    }\n\n'''
          text = text.replace(marker, helper + marker, 1)

          old = '''            onMovieSelected = {\n                restoreDetailFocusAfterPlayback = false\n                restoreCategoryFocusAfterDetailBack = false\n                selectedMovie = it\n                runtime.onDemandPresentationSession.showMovieDetail(\n                    sourceId = sourceId,\n                    movieId = it.movieId,\n                    returnToLibraryOnDetailBack = returnToLibraryOnDetailBack,\n                )\n            },\n            showCategoryStrip = false,\n'''
          new = '''            onMovieSelected = { movie, origin ->\n                restoreDetailFocusAfterPlayback = false\n                restoreCategoryFocusAfterDetailBack = false\n                restoreMovieFocusTarget = null\n                selectedMovieFocusOrigin = origin\n                selectedMovie = movie\n                runtime.onDemandPresentationSession.showMovieDetail(\n                    sourceId = sourceId,\n                    movieId = movie.movieId,\n                    returnToLibraryOnDetailBack = returnToLibraryOnDetailBack,\n                )\n            },\n            restoreFocusTarget = restoreMovieFocusTarget,\n            onMovieFocusRestored = { restoreMovieFocusTarget = null },\n            showCategoryStrip = false,\n'''
          if text.count(old) != 1:
              raise RuntimeError('Movies catalog selection block mismatch')
          text = text.replace(old, new, 1)

          old = '''                onClearProgress = { clearMovieProgress(movie) },\n                onPlay = { target ->\n                    restoreDetailFocusAfterPlayback = false\n                    runtime.playbackController.start(\n                        PlaybackRequest(\n                            sourceId = sourceId,\n                            channelId = target.movieId,\n                            mediaKind = PlaybackMediaKind.MOVIE,\n                        ),\n                    )\n                    runtime.onDemandPresentationSession.showMoviePlayback(\n                        sourceId = sourceId,\n                        movie = target,\n                        returnToLibraryOnDetailBack = returnToLibraryOnDetailBack,\n                    )\n                },\n'''
          new = '''                onClearProgress = { clearMovieProgress(movie) },\n                onPlay = { target -> startMoviePlayback(target, fromBeginning = false) },\n                onPlayFromBeginning = { target ->\n                    startMoviePlayback(target, fromBeginning = true)\n                },\n'''
          if text.count(old) != 1:
              raise RuntimeError('Movie details playback callback block mismatch')
          text = text.replace(old, new, 1)

          old = '''    onRefresh: () -> Unit,\n    onMovieSelected: (VodMovie) -> Unit,\n    showCategoryStrip: Boolean,\n'''
          new = '''    onRefresh: () -> Unit,\n    onMovieSelected: (VodMovie, MovieFocusOrigin) -> Unit,\n    restoreFocusTarget: MovieFocusTarget?,\n    onMovieFocusRestored: () -> Unit,\n    showCategoryStrip: Boolean,\n'''
          if text.count(old) != 1:
              raise RuntimeError('MoviesCatalogContent signature mismatch')
          text = text.replace(old, new, 1)

          old = '''                items(catalog.continueWatching, key = { "continue-${it.movieId}" }) { movie ->\n                    ContinueWatchingCard(movie = movie, onClick = { onMovieSelected(movie) })\n                }\n'''
          new = '''                items(catalog.continueWatching, key = { "continue-${it.movieId}" }) { movie ->\n                    ContinueWatchingCard(\n                        movie = movie,\n                        restoreFocus = restoreFocusTarget == MovieFocusTarget(\n                            movieId = movie.movieId,\n                            origin = MovieFocusOrigin.CONTINUE_WATCHING,\n                        ),\n                        onFocusRestored = onMovieFocusRestored,\n                        onClick = { onMovieSelected(movie, MovieFocusOrigin.CONTINUE_WATCHING) },\n                    )\n                }\n'''
          if text.count(old) != 1:
              raise RuntimeError('Continue Watching selection block mismatch')
          text = text.replace(old, new, 1)

          old = '''                items(movies, key = { it.movieId }) { movie ->\n                    MovieCard(movie = movie, onClick = { onMovieSelected(movie) })\n                }\n'''
          new = '''                items(movies, key = { it.movieId }) { movie ->\n                    MovieCard(\n                        movie = movie,\n                        restoreFocus = restoreFocusTarget == MovieFocusTarget(\n                            movieId = movie.movieId,\n                            origin = MovieFocusOrigin.GRID,\n                        ),\n                        onFocusRestored = onMovieFocusRestored,\n                        onClick = { onMovieSelected(movie, MovieFocusOrigin.GRID) },\n                    )\n                }\n'''
          if text.count(old) != 1:
              raise RuntimeError('Movie grid selection block mismatch')
          text = text.replace(old, new, 1)

          start = text.index('@Composable\nprivate fun MovieCard(')
          end = text.index('\n@OptIn(UnstableApi::class)', start)
          replacement = '''@Composable\nprivate fun MovieCard(\n    movie: VodMovie,\n    restoreFocus: Boolean,\n    onFocusRestored: () -> Unit,\n    onClick: () -> Unit,\n) {\n    val focusRequester = remember(movie.movieId) { FocusRequester() }\n    var focused by remember(movie.movieId) { mutableStateOf(false) }\n\n    LaunchedEffect(restoreFocus, movie.movieId) {\n        if (!restoreFocus) return@LaunchedEffect\n        withFrameNanos { }\n        focusRequester.requestFocus()\n        onFocusRestored()\n    }\n\n    Column(\n        modifier = Modifier\n            .fillMaxWidth()\n            .focusRequester(focusRequester)\n            .onFocusChanged { focused = it.isFocused }\n            .border(\n                width = 2.dp,\n                color = if (focused) MaterialTheme.colorScheme.primary else Color.Transparent,\n                shape = RoundedCornerShape(8.dp),\n            )\n            .padding(4.dp)\n            .clickable(onClick = onClick),\n        verticalArrangement = Arrangement.spacedBy(5.dp),\n    ) {\n        Box {\n            RemotePoster(\n                url = movie.posterUrl,\n                title = movie.name,\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .aspectRatio(2f / 3f),\n            )\n            if (movie.isFavorite) {\n                Surface(\n                    modifier = Modifier\n                        .align(Alignment.TopEnd)\n                        .padding(5.dp),\n                    shape = RoundedCornerShape(999.dp),\n                    color = MaterialTheme.colorScheme.surface.copy(alpha = 0.88f),\n                ) {\n                    Icon(\n                        Icons.Filled.Favorite,\n                        contentDescription = null,\n                        modifier = Modifier\n                            .padding(5.dp)\n                            .size(15.dp),\n                        tint = MaterialTheme.colorScheme.primary,\n                    )\n                }\n            }\n            movieProgressFraction(movie)?.let { progress ->\n                Box(\n                    modifier = Modifier\n                        .align(Alignment.BottomStart)\n                        .fillMaxWidth()\n                        .height(3.dp)\n                        .background(Color.Black.copy(alpha = 0.55f)),\n                ) {\n                    Box(\n                        modifier = Modifier\n                            .fillMaxWidth(progress)\n                            .fillMaxHeight()\n                            .background(MaterialTheme.colorScheme.primary),\n                    )\n                }\n            }\n        }\n        Text(\n            text = movie.name,\n            style = MaterialTheme.typography.bodySmall,\n            fontWeight = FontWeight.SemiBold,\n            maxLines = 2,\n            overflow = TextOverflow.Ellipsis,\n        )\n        movie.rating?.let { rating ->\n            Text(\n                text = "★ %.1f".format(rating),\n                style = MaterialTheme.typography.labelSmall,\n                color = MaterialTheme.colorScheme.onSurfaceVariant,\n            )\n        }\n    }\n}\n\n@Composable\nprivate fun ContinueWatchingCard(\n    movie: VodMovie,\n    restoreFocus: Boolean,\n    onFocusRestored: () -> Unit,\n    onClick: () -> Unit,\n) {\n    val focusRequester = remember(movie.movieId) { FocusRequester() }\n    var focused by remember(movie.movieId) { mutableStateOf(false) }\n\n    LaunchedEffect(restoreFocus, movie.movieId) {\n        if (!restoreFocus) return@LaunchedEffect\n        withFrameNanos { }\n        focusRequester.requestFocus()\n        onFocusRestored()\n    }\n\n    Surface(\n        modifier = Modifier\n            .width(220.dp)\n            .focusRequester(focusRequester)\n            .onFocusChanged { focused = it.isFocused }\n            .border(\n                width = 2.dp,\n                color = if (focused) MaterialTheme.colorScheme.primary else Color.Transparent,\n                shape = RoundedCornerShape(12.dp),\n            )\n            .clickable(onClick = onClick),\n        shape = RoundedCornerShape(12.dp),\n        tonalElevation = 1.dp,\n    ) {\n        Row(\n            modifier = Modifier.padding(7.dp),\n            horizontalArrangement = Arrangement.spacedBy(8.dp),\n        ) {\n            RemotePoster(\n                url = movie.posterUrl,\n                title = movie.name,\n                modifier = Modifier\n                    .width(54.dp)\n                    .aspectRatio(2f / 3f),\n            )\n            Column(modifier = Modifier.weight(1f)) {\n                Text(\n                    text = movie.name,\n                    style = MaterialTheme.typography.bodySmall,\n                    fontWeight = FontWeight.SemiBold,\n                    maxLines = 2,\n                    overflow = TextOverflow.Ellipsis,\n                )\n                Text(\n                    text = "Resume",\n                    style = MaterialTheme.typography.labelSmall,\n                    color = MaterialTheme.colorScheme.primary,\n                )\n            }\n        }\n    }\n}\n\nprivate enum class MovieFocusOrigin {\n    GRID,\n    CONTINUE_WATCHING,\n}\n\nprivate data class MovieFocusTarget(\n    val movieId: String,\n    val origin: MovieFocusOrigin,\n)\n\ninternal fun moviePlaybackSnapshot(\n    movie: VodMovie,\n    fromBeginning: Boolean,\n): VodMovie = if (fromBeginning) {\n    movie.copy(\n        positionMs = null,\n        progressCompleted = false,\n        progressUpdatedAtEpochMillis = null,\n    )\n} else {\n    movie\n}\n'''
          text = text[:start] + replacement + text[end:]
          route.write_text(text, encoding='utf-8')

          details = Path('app/src/main/java/app/ownplay/player/ui/vod/MovieDetailsPane.kt')
          text = details.read_text(encoding='utf-8')
          old = '''    onClearProgress: () -> Unit,\n    onPlay: (VodMovie) -> Unit,\n    modifier: Modifier,\n'''
          new = '''    onClearProgress: () -> Unit,\n    onPlay: (VodMovie) -> Unit,\n    onPlayFromBeginning: (VodMovie) -> Unit,\n    modifier: Modifier,\n'''
          if text.count(old) != 1:
              raise RuntimeError('MovieDetailsPane callback signature mismatch')
          text = text.replace(old, new, 1)

          old = '''            Row(\n                modifier = Modifier.fillMaxWidth(),\n                horizontalArrangement = Arrangement.spacedBy(8.dp),\n            ) {\n                Button(\n                    onClick = { onPlay(movie) },\n                    modifier = Modifier\n                        .weight(1f)\n                        .focusRequester(detailPrimaryFocusRequester),\n                    shape = RoundedCornerShape(10.dp),\n                ) {\n                    Icon(Icons.Filled.PlayArrow, contentDescription = null)\n                    Spacer(Modifier.width(6.dp))\n                    Text(if (movie.resumeAvailable) "Resume" else "Play")\n                }\n                FilledTonalButton(\n                    onClick = { onFavoriteChanged(!movie.isFavorite) },\n                    shape = RoundedCornerShape(10.dp),\n                ) {\n                    Icon(\n                        if (movie.isFavorite) Icons.Filled.Favorite else Icons.Filled.FavoriteBorder,\n                        contentDescription = null,\n                    )\n                }\n            }\n'''
          new = '''            Row(\n                modifier = Modifier.fillMaxWidth(),\n                horizontalArrangement = Arrangement.spacedBy(8.dp),\n            ) {\n                Button(\n                    onClick = { onPlay(movie) },\n                    modifier = Modifier\n                        .weight(1f)\n                        .focusRequester(detailPrimaryFocusRequester),\n                    shape = RoundedCornerShape(10.dp),\n                ) {\n                    Icon(Icons.Filled.PlayArrow, contentDescription = null)\n                    Spacer(Modifier.width(6.dp))\n                    Text(if (movie.resumeAvailable) "Continue" else "Play")\n                }\n                FilledTonalButton(\n                    onClick = { onFavoriteChanged(!movie.isFavorite) },\n                    shape = RoundedCornerShape(10.dp),\n                ) {\n                    Icon(\n                        if (movie.isFavorite) Icons.Filled.Favorite else Icons.Filled.FavoriteBorder,\n                        contentDescription = null,\n                    )\n                }\n            }\n\n            if (movie.resumeAvailable) {\n                FilledTonalButton(\n                    onClick = { onPlayFromBeginning(movie) },\n                    modifier = Modifier.fillMaxWidth(),\n                    shape = RoundedCornerShape(10.dp),\n                ) {\n                    Icon(Icons.Filled.PlayArrow, contentDescription = null)\n                    Spacer(Modifier.width(6.dp))\n                    Text("Play from beginning")\n                }\n            }\n'''
          if text.count(old) != 1:
              raise RuntimeError('MovieDetailsPane primary action block mismatch')
          details.write_text(text.replace(old, new, 1), encoding='utf-8')

          contract_test = Path('app/src/test/java/app/ownplay/player/ui/vod/MoviesTvContractTest.kt')
          contract_test.write_text('''package app.ownplay.player.ui.vod\n\nimport app.ownplay.player.testing.sourceText\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass MoviesTvContractTest {\n    @Test\n    fun `movies use provider categories without an All destination`() {\n        val route = sourceText("src/main/java/app/ownplay/player/ui/vod/VodRoute.kt")\n\n        assertTrue(route.contains("items(catalog.categories"))\n        assertTrue(route.contains("category.providerCategoryKey"))\n        assertFalse(route.contains("\\\"All\\\""))\n    }\n\n    @Test\n    fun `continue watching stays inside Movies and opens movie details`() {\n        val route = sourceText("src/main/java/app/ownplay/player/ui/vod/VodRoute.kt")\n\n        assertTrue(route.contains("text = \\\"Continue Watching\\\""))\n        assertTrue(route.contains("MovieFocusOrigin.CONTINUE_WATCHING"))\n        assertTrue(route.contains("showMovieDetail("))\n    }\n\n    @Test\n    fun `movie details expose Continue and Play from beginning`() {\n        val details = sourceText("src/main/java/app/ownplay/player/ui/vod/MovieDetailsPane.kt")\n\n        assertTrue(details.contains("Text(if (movie.resumeAvailable) \\\"Continue\\\" else \\\"Play\\\")"))\n        assertTrue(details.contains("Text(\\\"Play from beginning\\\")"))\n        assertTrue(details.contains("onPlayFromBeginning(movie)"))\n    }\n\n    @Test\n    fun `details Back restores the originating movie item`() {\n        val route = sourceText("src/main/java/app/ownplay/player/ui/vod/VodRoute.kt")\n\n        assertTrue(route.contains("MovieFocusTarget(movie.movieId, origin)"))\n        assertTrue(route.contains("origin = MovieFocusOrigin.GRID"))\n        assertTrue(route.contains("origin = MovieFocusOrigin.CONTINUE_WATCHING"))\n        assertTrue(route.contains("focusRequester.requestFocus()"))\n        assertTrue(route.contains("onFocusChanged { focused = it.isFocused }"))\n        assertTrue(route.contains("width = 2.dp"))\n    }\n}\n''', encoding='utf-8')

          policy_test = Path('app/src/test/java/app/ownplay/player/ui/vod/MoviePlaybackStartPolicyTest.kt')
          policy_test.write_text('''package app.ownplay.player.ui.vod\n\nimport app.ownplay.player.vod.VodMovie\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertNull\nimport org.junit.Assert.assertSame\nimport org.junit.Test\n\nclass MoviePlaybackStartPolicyTest {\n    @Test\n    fun `continue keeps the saved playback checkpoint`() {\n        val movie = movie()\n\n        assertSame(movie, moviePlaybackSnapshot(movie, fromBeginning = false))\n    }\n\n    @Test\n    fun `play from beginning clears only the playback snapshot checkpoint`() {\n        val movie = movie()\n\n        val playback = moviePlaybackSnapshot(movie, fromBeginning = true)\n\n        assertNull(playback.positionMs)\n        assertEquals(false, playback.progressCompleted)\n        assertNull(playback.progressUpdatedAtEpochMillis)\n        assertEquals(45_000L, movie.positionMs)\n        assertEquals(300_000L, movie.durationMs)\n    }\n\n    private fun movie() = VodMovie(\n        movieId = "movie-1",\n        providerStreamId = 11,\n        categoryKey = "provider-category",\n        name = "Movie",\n        posterUrl = null,\n        containerExtension = "mp4",\n        rating = null,\n        addedAtEpochSeconds = null,\n        isFavorite = false,\n        positionMs = 45_000L,\n        durationMs = 300_000L,\n        progressCompleted = false,\n        progressUpdatedAtEpochMillis = 123L,\n    )\n}\n''', encoding='utf-8')
          PY

          git diff --check
          if grep -RInE '"All"' \
            app/src/main/java/app/ownplay/player/ui/vod \
            app/src/test/java/app/ownplay/player/ui/vod; then
            echo 'Forbidden All label remains in Movies UI.' >&2
            exit 2
          fi
          grep -Fq 'Text(if (movie.resumeAvailable) "Continue" else "Play")' app/src/main/java/app/ownplay/player/ui/vod/MovieDetailsPane.kt
          grep -Fq 'Text("Play from beginning")' app/src/main/java/app/ownplay/player/ui/vod/MovieDetailsPane.kt
          grep -Fq 'moviePlaybackSnapshot(target, fromBeginning)' app/src/main/java/app/ownplay/player/ui/vod/VodRoute.kt
          grep -Fq 'MovieFocusOrigin.CONTINUE_WATCHING' app/src/main/java/app/ownplay/player/ui/vod/VodRoute.kt
          grep -Fq 'MovieFocusOrigin.GRID' app/src/main/java/app/ownplay/player/ui/vod/VodRoute.kt
          grep -Fq 'items(catalog.categories' app/src/main/java/app/ownplay/player/ui/vod/VodRoute.kt

      - name: Remove runner and create exact candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-movies-tv-contract-hardening.yml
          git config user.name 'OwnPlay TV Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Movies TV navigation and playback choices'
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Validate exact Movies candidate without APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          gradle \
            :app:kspDebugKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:compileDebugAndroidTestKotlin \
            --stacktrace

      - name: Verify zero APK and Room stability
        shell: bash
        run: |
          set -euo pipefail
          count="$(find app/build -type f -name '*.apk' -print 2>/dev/null | tee /tmp/ownplay-tv-apks.txt | wc -l)"
          echo "APK artifacts: ${count}"
          test "$count" -eq 0
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path('app/schemas')
          generated = sorted(root.rglob('*.json'))
          problems = []
          if len(generated) != 6:
              problems.append(f'Expected 6 Room schemas, found {len(generated)}.')
          for path in generated:
              relative = path.as_posix()
              committed = subprocess.check_output(['git', 'show', f'HEAD:{relative}'], text=True)
              if json.loads(path.read_text(encoding='utf-8')) != json.loads(committed):
                  problems.append(f'Room schema drift: {relative}')
          if problems:
              print('\n'.join(problems))
              sys.exit(7)
          print('Validated 6 committed Room schema files.')
          PY
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"

      - name: Push validated Movies candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/movies-tv-contract-hardening-no-apk
          echo "Validated final HEAD: $FINAL_HEAD"
