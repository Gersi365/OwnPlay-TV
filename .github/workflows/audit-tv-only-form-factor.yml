name: Audit TV-only form factor leftovers

on:
  push:
    branches:
      - agent/tv-only-form-factor-cleanup-no-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inventory mobile and orientation leftovers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BUILD / MANIFEST ==='
          grep -RInE --exclude-dir=.git --exclude='*.json' \
            'create\("mobile"\)|app\.ownplay\.mobile|IS_TV_BUILD|TARGET_DEVICE|screenOrientation|configChanges=.*orientation' \
            app/build.gradle.kts app/src || true
          echo '=== MOBILE / PROFILE / ORIENTATION / PIP / TOUCH ==='
          grep -RInE --exclude-dir=.git --exclude='*.json' \
            'AppDeviceProfile|AppOrientation|SMARTPHONE|TOUCHSCREEN|PORTRAIT|LANDSCAPE|portrait|landscape|Orientation|orientation|PictureInPicture|inPictureInPicture|PiP|GestureDetector|MotionEvent|dispatchTouchEvent|sensorRotation|rotationFullscreen|UI_MODE_TYPE_(NORMAL|TELEVISION)' \
            app/src OwnPlay_TV_*.md || true
          echo '=== MOBILE-ONLY UI / OFFLINE WIRING ==='
          grep -RInE --exclude-dir=.git --exclude='*.json' \
            'DownloadsSettingsScreen|DownloadPlaybackBridge|OfflineDownloadFeatureRuntime|PictureInPicturePlaybackSurface|LibraryPlaybackScreen|PlaybackOriginBadge' \
            app/src || true
