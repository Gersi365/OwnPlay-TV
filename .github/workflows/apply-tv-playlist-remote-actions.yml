name: Apply TV playlist remote actions patch

on:
  push:
    branches:
      - agent/tv-playlists-remote-actions-no-apk

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: agent/tv-playlists-remote-actions-no-apk
          fetch-depth: 1

      - name: Apply deterministic source patch
        run: python3 tools/apply_tv_playlist_remote_actions.py

      - name: Commit source patch and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-tv-playlist-remote-actions.yml
          rm tools/apply_tv_playlist_remote_actions.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/ownplay/player/ui/SettingsPlaylist.kt
          git add app/src/main/java/app/ownplay/player/ui/PlaylistSettingsScreen.kt
          git add app/src/tv/java/app/ownplay/player/ui/TvSettingsScreen.kt
          git add app/src/test/java/app/ownplay/player/ui/TvPlaylistRemoteActionsContractTest.kt
          git add -u .github/workflows tools
          git diff --cached --check
          git commit -m 'Make TV playlist actions remote-first'
          git push origin HEAD:agent/tv-playlists-remote-actions-no-apk
