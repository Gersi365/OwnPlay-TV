name: Validate Approved UI Reference Cleanup

on:
  push:
    branches:
      - 'agent/approved-ui-reference-cleanup'
    paths:
      - '.github/workflows/validate-approved-ui-reference-cleanup.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/approved-ui-reference-cleanup
          fetch-depth: 1

      - name: Remove temporary validator and establish final HEAD
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-approved-ui-reference-cleanup.yml
          git config user.name 'OwnPlay TV Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary approved UI cleanup validator'
          git push origin HEAD:agent/approved-ui-reference-cleanup
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify approved reference boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          test -f app/src/tvDebug/java/app/ownplay/player/prototype/TvVisualPrototypeScreens.kt
          test ! -e app/src/tvDebug/java/app/ownplay/player/prototype/TvOnlyAboutPrototype.kt
          test ! -e tools/apply_tv_visual_left_rail_provider_categories.py
          test ! -e tools/capture_tv_visual_prototype.sh
          test ! -e .github/workflows/tv-visual-prototype-screenshots.yml
          test ! -e .github/workflows/apply-tv-only-shared-cleanup.yml
          test ! -e .github/workflows/audit-tv-only-form-factor.yml
          test ! -e tools/apply_tv_only_form_factor_cleanup.py
          test ! -e tools/apply_tv_only_shared_cleanup.py
          test ! -e tools/apply_tv_only_live_policy_cleanup.py
          test ! -e tools/tv_only_form_factor_cleanup_inline.yml
          grep -q 'private fun PrimaryRail' app/src/tvDebug/java/app/ownplay/player/prototype/TvVisualPrototypeScreens.kt
          ! grep -q 'TopBar(' app/src/tvDebug/java/app/ownplay/player/prototype/TvVisualPrototypeScreens.kt
          ! grep -q 'Nav("Live"' app/src/tvDebug/java/app/ownplay/player/prototype/TvVisualPrototypeScreens.kt
          ! grep -Eq '\bAll\b' app/src/tvDebug/java/app/ownplay/player/prototype/TvVisualPrototypeScreens.kt
          grep -Fq 'Global navigation must not be placed across the top of the screen.' OwnPlay_TV_SOURCE.md
          grep -Fq '# 13. Movies, Series & On-Demand Playback' OwnPlay_TV_SOURCE.md
          ! grep -Fq 'Offline filtering in Library' OwnPlay_TV_SOURCE.md
          ! grep -Fq 'nested Library screen' OwnPlay_TV_SOURCE.md
          grep -Fq 'must not render persistent destination text labels' OwnPlay_TV_UI_INTERACTION_CONTRACT.md

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Validate TV source without APK
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :app:kspTvDebugKotlin \
            :app:testTvDebugUnitTest \
            :app:lintTvDebug \
            :app:compileTvDebugAndroidTestKotlin \
            --stacktrace

      - name: Verify zero APK and Room schema stability
        shell: bash
        run: |
          set -euo pipefail
          count="$(find app/build -type f -name '*.apk' -print 2>/dev/null | tee /tmp/ownplay-tv-apks.txt | wc -l)"
          echo "APK artifacts: ${count}"
          test "$count" -eq 0
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path('app/schemas')
          problems = []
          generated = sorted(root.rglob('*.json'))
          if not generated:
              problems.append('No Room schema JSON found.')
          for path in generated:
              relative = path.as_posix()
              committed = subprocess.check_output(['git', 'show', f'HEAD:{relative}'], text=True)
              if json.loads(path.read_text(encoding='utf-8')) != json.loads(committed):
                  problems.append(f'Room schema drift: {relative}')
          if problems:
              print('\n'.join(problems))
              sys.exit(5)
          print(f'Validated {len(generated)} committed Room schema files.')
          PY
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          echo "Validated final HEAD: $FINAL_HEAD"
