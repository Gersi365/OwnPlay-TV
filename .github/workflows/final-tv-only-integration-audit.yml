name: Final OwnPlay TV-only integration audit

on:
  push:
    branches:
      - agent/final-tv-only-integration-audit-no-apk
    paths:
      - '.github/workflows/final-tv-only-integration-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/final-tv-only-integration-audit-no-apk
          fetch-depth: 0

      - name: Verify authorized base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3269ecd09ab5ca40ddf5d630a52f1ee5e1bb59a0"
          git diff --quiet 3269ecd09ab5ca40ddf5d630a52f1ee5e1bb59a0 HEAD^ -- app OwnPlay_TV_SOURCE.md OwnPlay_TV_UI_INTERACTION_CONTRACT.md OwnPlay_TV_ENGINEERING_WORKFLOW.md

      - name: Audit final TV-only integration surface
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SOURCE SETS ==='
          find app/src -maxdepth 2 -type d -print | sort
          echo '=== BUILD IDENTITY / FLAVORS ==='
          grep -nE 'applicationId|namespace|productFlavors|flavorDimensions|applicationIdSuffix|IS_TV_BUILD|mobile|tvDebug' app/build.gradle.kts || true
          echo '=== MANIFEST TV CONTRACT ==='
          grep -nE 'uses-feature|leanback|touchscreen|screenOrientation|supportsPictureInPicture|resizeableActivity|MainActivity' app/src/main/AndroidManifest.xml || true
          echo '=== ACTIVE UI LEGACY TERMS ==='
          grep -RInE 'TVSection\.LIBRARY|UnifiedLibraryRoute|onOpenLibrary|Portrait|Landscape|requestedOrientation|ActivityInfo\.SCREEN_ORIENTATION|PictureInPicture|supportsPictureInPicture|enterPictureInPictureMode|GestureDetector|dispatchTouchEvent|pointerInput|detectTapGestures|detectDragGestures|Downloads|Offline media|OfflineMedia|Play Offline|Resume Offline|Phone Downloads|Saving to phone Downloads' app/src/main/java/app/ownplay/player/ui app/src/main/java/app/ownplay/player/MainActivity.kt || true
          echo '=== ACTIVE UI FORBIDDEN ALL LABEL ==='
          grep -RIn '"All"' app/src/main/java/app/ownplay/player/ui || true
          echo '=== ACTIVE ROUTE GRAPH ==='
          grep -nE 'enum class TVSection|TVSection\.|LiveRoute\(|VodRoute\(|SeriesRoute\(|TvSettingsScreen\(' app/src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt || true
          echo '=== PACKAGE / SOURCE RESIDUE ==='
          find app/src -type f \( -path '*mobile*' -o -path '*tvDebug*' -o -path '*prototype*' -o -path '*library*' \) -print | sort || true
          grep -RInE 'app\.ownplay\.mobile|app\.ownplay\.player\.mobile|IS_TV_BUILD|smartphone|phone profile|portrait mode|landscape mode' app/src/main app/build.gradle.kts || true
          echo '=== OFFLINE BACKEND (INFORMATIONAL ONLY) ==='
          find app/src/main/java/app/ownplay/player/download -type f -print | sort || true
          echo '=== EXACT AUDIT HEAD ==='
          git rev-parse HEAD
