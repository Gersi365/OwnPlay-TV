name: Apply OwnPlay TV legacy deletion hardening

on:
  push:
    branches:
      - agent/legacy-deletion-hardening-no-apk
    paths:
      - .github/workflows/apply-legacy-tv-deletion-hardening.yml

permissions:
  contents: write

jobs:
  delete-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact legacy deletion branch
        uses: actions/checkout@v6
        with:
          ref: agent/legacy-deletion-hardening-no-apk
          fetch-depth: 0

      - name: Verify authorized audited base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a156dd1898983d46f7cc07b586fc7890aa4bb4d1"
          git diff --quiet e2271bfbb620acc68ad5875fd32cd6cb42ce67ac HEAD^ -- app OwnPlay_TV_SOURCE.md OwnPlay_TV_UI_INTERACTION_CONTRACT.md OwnPlay_TV_ENGINEERING_WORKFLOW.md

      - name: Remove verified superseded TV presentation residue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('app/src/main/java/app/ownplay/player/ui')
          test_root = Path('app/src/test/java/app/ownplay/player')

          # Whole Library presentation has no production references outside its own package.
          shutil.rmtree(root / 'library')
          shutil.rmtree(test_root / 'ui/library')

          # This helper existed only for the removed offline Library focus graph.
          (root / 'OfflineMediaTvFocusPolicy.kt').unlink()
          (test_root / 'ui/OfflineMediaTvFocusPolicyTest.kt').unlink()

          # Debug source set contains only the superseded visual-approval prototype and manifest.
          shutil.rmtree(Path('app/src/debug'))

          # Keep the active on-demand playback contract; remove assertions for deleted offline Library UI.
          path = test_root / 'ui/OnDemandPlaybackPresentationContractTest.kt'
          text = path.read_text(encoding='utf-8')
          old = '''    @Test\n    fun `series and offline use shared presentation instead of native controller chrome`() {\n        val series = sourceText("src/main/java/app/ownplay/player/ui/series/SeriesRoute.kt")\n        val seriesPlayback = sourceBlockAfter(series, "private fun SeriesPlaybackScreen(")\n        val offline = sourceText("src/main/java/app/ownplay/player/ui/library/LibraryPlaybackScreen.kt")\n        val offlinePlayback = sourceBlockAfter(offline, "internal fun LibraryPlaybackScreen(")\n\n        assertTrue(seriesPlayback.contains("OnDemandPlaybackSurface("))\n        assertFalse(seriesPlayback.contains("showNativeController = true"))\n        assertTrue(offlinePlayback.contains("OnDemandPlaybackSurface("))\n        assertFalse(offlinePlayback.contains("useController = true"))\n        assertFalse(offlinePlayback.contains("LibraryOfflineBadge"))\n        assertFalse(offlinePlayback.contains("OFFLINE"))\n        assertFalse(offlinePlayback.contains("Local file"))\n    }\n'''
          new = '''    @Test\n    fun `series uses shared presentation instead of native controller chrome`() {\n        val series = sourceText("src/main/java/app/ownplay/player/ui/series/SeriesRoute.kt")\n        val seriesPlayback = sourceBlockAfter(series, "private fun SeriesPlaybackScreen(")\n\n        assertTrue(seriesPlayback.contains("OnDemandPlaybackSurface("))\n        assertFalse(seriesPlayback.contains("showNativeController = true"))\n    }\n'''
          if text.count(old) != 1:
              raise RuntimeError('OnDemand playback legacy Library contract block mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Preserve backend download resilience tests; remove only the obsolete Library presentation test.
          path = test_root / 'download/OfflineDownloadResilienceContractTest.kt'
          text = path.read_text(encoding='utf-8')
          marker = '''\n    @Test\n    fun offlinePlaybackPresentationIsProcessScopedAndDisposeDoesNotStopPlayback() {'''
          start = text.find(marker)
          if start < 0:
              raise RuntimeError('Offline Library resilience test block not found')
          # The obsolete block is the final test in the class; retain the class closing brace.
          text = text[:start] + '\n}' + '\n'
          path.write_text(text, encoding='utf-8')

          # Focused forward regression guard for the approved TV-only presentation tree.
          guard = test_root / 'ui/TvLegacyPresentationRemovalContractTest.kt'
          guard.write_text('''package app.ownplay.player.ui\n\nimport java.nio.file.Files\nimport java.nio.file.Path\nimport kotlin.io.path.readText\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass TvLegacyPresentationRemovalContractTest {\n    @Test\n    fun `superseded library and prototype presentation sources are absent`() {\n        assertFalse(exists("src/main/java/app/ownplay/player/ui/library"))\n        assertFalse(exists("src/main/java/app/ownplay/player/ui/OfflineMediaTvFocusPolicy.kt"))\n        assertFalse(exists("src/debug"))\n    }\n\n    @Test\n    fun `active TV shell contains no Library route`() {\n        val shell = text("src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt")\n        assertFalse(shell.contains("TVSection.LIBRARY"))\n        assertFalse(shell.contains("UnifiedLibraryRoute"))\n        assertFalse(shell.contains("onOpenLibrary"))\n        assertTrue(shell.contains("TVSection.MOVIES"))\n        assertTrue(shell.contains("TVSection.SERIES"))\n    }\n\n    private fun exists(relativeToApp: String): Boolean = candidates(relativeToApp).any(Files::exists)\n\n    private fun text(relativeToApp: String): String {\n        val source = candidates(relativeToApp).firstOrNull(Files::exists)\n            ?: error("Source file not found: $relativeToApp")\n        return source.readText()\n    }\n\n    private fun candidates(relativeToApp: String): List<Path> = listOf(\n        Path.of(relativeToApp),\n        Path.of("app").resolve(relativeToApp),\n    )\n}\n''', encoding='utf-8')
          PY

          git diff --check
          test ! -e app/src/main/java/app/ownplay/player/ui/library
          test ! -e app/src/test/java/app/ownplay/player/ui/library
          test ! -e app/src/main/java/app/ownplay/player/ui/OfflineMediaTvFocusPolicy.kt
          test ! -e app/src/debug
          ! grep -RInE 'app\.ownplay\.player\.ui\.library|UnifiedLibraryRoute|LibraryPlaybackScreen|LibraryPlaybackPresentationSession|OfflineMediaTvFocusPolicy' app/src/main app/src/test app/src/androidTest
          ! grep -RInE 'TVSection\.LIBRARY|onOpenLibrary' app/src/main/java/app/ownplay/player/ui
          if grep -RInE '"All"' app/src/main/java/app/ownplay/player/ui; then
            echo 'Forbidden All label remains in active TV UI.' >&2
            exit 3
          fi

      - name: Remove temporary audit runners and create exact candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/audit-legacy-tv-residue.yml
          rm .github/workflows/apply-legacy-tv-deletion-hardening.yml
          git config user.name 'OwnPlay TV Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove superseded Library and prototype presentation'
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Validate exact legacy-deletion candidate without APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          gradle \
            :app:kspDebugKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:compileDebugAndroidTestKotlin \
            --stacktrace

      - name: Verify zero APK and Room stability
        shell: bash
        run: |
          set -euo pipefail
          count="$(find app/build -type f -name '*.apk' -print 2>/dev/null | tee /tmp/ownplay-tv-apks.txt | wc -l)"
          echo "APK artifacts: ${count}"
          test "$count" -eq 0
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path('app/schemas')
          generated = sorted(root.rglob('*.json'))
          problems = []
          if len(generated) != 6:
              problems.append(f'Expected 6 Room schemas, found {len(generated)}.')
          for path in generated:
              relative = path.as_posix()
              committed = subprocess.check_output(['git', 'show', f'HEAD:{relative}'], text=True)
              if json.loads(path.read_text(encoding='utf-8')) != json.loads(committed):
                  problems.append(f'Room schema drift: {relative}')
          if problems:
              print('\n'.join(problems))
              sys.exit(7)
          print('Validated 6 committed Room schema files.')
          PY
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"

      - name: Push validated legacy-deletion candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/legacy-deletion-hardening-no-apk
          echo "Validated final HEAD: $FINAL_HEAD"
