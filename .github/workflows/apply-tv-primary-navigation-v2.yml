name: Apply OwnPlay TV primary navigation v2

on:
  push:
    branches:
      - agent/tv-only-foundation

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v6
        with:
          ref: agent/tv-only-foundation
          fetch-depth: 0

      - name: Verify source is still exact approved foundation
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 9fcc43684b47a20d8155ae57f8bd8cb21fc06572 HEAD^ -- \
            app \
            OwnPlay_TV_SOURCE.md \
            OwnPlay_TV_UI_INTERACTION_CONTRACT.md \
            OwnPlay_TV_ENGINEERING_WORKFLOW.md

      - name: Apply corrected TV rail migration
        shell: bash
        run: |
          set -euo pipefail
          git show fdcc50d1faca959c1a1871f7070c58e9fcb247aa:.github/workflows/apply-tv-primary-navigation.yml > /tmp/primary-nav-v1.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/primary-nav-v1.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow.find(start_marker)
          if start < 0:
              raise RuntimeError('Historical migration Python start marker missing')
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise RuntimeError('Historical migration Python end marker missing')
          code = textwrap.dedent(workflow[start:end])

          wrong_geometry_import = "'import androidx.compose.foundation.layout.padding\\nimport androidx.compose.foundation.layout.size\\nimport androidx.compose.foundation.layout.width\\nimport androidx.compose.foundation.layout.weight\\n',"
          fixed_geometry_import = "'import androidx.compose.foundation.layout.padding\\nimport androidx.compose.foundation.layout.size\\nimport androidx.compose.foundation.layout.width\\n',"
          if code.count(wrong_geometry_import) != 1:
              raise RuntimeError('Expected one obsolete weight import replacement')
          code = code.replace(wrong_geometry_import, fixed_geometry_import, 1)

          wrong_key_import = "'import androidx.compose.ui.graphics.vector.ImageVector\\nimport androidx.compose.ui.input.key.Key\\nimport androidx.compose.ui.input.key.KeyEventType\\nimport androidx.compose.ui.input.key.onPreviewKeyEvent\\n',"
          fixed_key_import = "'import androidx.compose.ui.graphics.vector.ImageVector\\nimport androidx.compose.ui.input.key.Key\\nimport androidx.compose.ui.input.key.KeyEventType\\nimport androidx.compose.ui.input.key.key\\nimport androidx.compose.ui.input.key.onPreviewKeyEvent\\nimport androidx.compose.ui.input.key.type\\n',"
          if code.count(wrong_key_import) != 1:
              raise RuntimeError('Expected one incomplete key import replacement')
          code = code.replace(wrong_key_import, fixed_key_import, 1)

          exec(compile(code, '/tmp/primary-nav-migration.py', 'exec'), {})
          PY

          git diff --check
          test -f app/src/test/java/app/ownplay/player/ui/TvPrimaryNavigationContractTest.kt
          if grep -nE 'TVSection\.LIBRARY|onOpenLibrary|label = "Library"|TVPrimaryNavigationBar|Scaffold\(' app/src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt; then
            echo 'Obsolete global navigation remains in production shell.' >&2
            exit 2
          fi
          if grep -nE 'androidx\.compose\.foundation\.layout\.weight' app/src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt; then
            echo 'Invalid Compose weight import remains.' >&2
            exit 3
          fi
          grep -Fq 'import androidx.compose.ui.input.key.key' app/src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt
          grep -Fq 'import androidx.compose.ui.input.key.type' app/src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt

      - name: Remove temporary runner and create candidate commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-tv-primary-navigation-v2.yml
          git config user.name 'OwnPlay TV Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Move primary navigation to TV rail'
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Validate exact candidate without APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          gradle \
            :app:kspDebugKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:compileDebugAndroidTestKotlin \
            --stacktrace

      - name: Verify zero APK and Room stability
        shell: bash
        run: |
          set -euo pipefail
          count="$(find app/build -type f -name '*.apk' -print 2>/dev/null | tee /tmp/ownplay-tv-apks.txt | wc -l)"
          echo "APK artifacts: ${count}"
          test "$count" -eq 0
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path('app/schemas')
          problems = []
          generated = sorted(root.rglob('*.json'))
          if not generated:
              problems.append('No Room schema JSON found.')
          for path in generated:
              relative = path.as_posix()
              committed = subprocess.check_output(['git', 'show', f'HEAD:{relative}'], text=True)
              if json.loads(path.read_text(encoding='utf-8')) != json.loads(committed):
                  problems.append(f'Room schema drift: {relative}')
          if problems:
              print('\n'.join(problems))
              sys.exit(7)
          print(f'Validated {len(generated)} committed Room schema files.')
          PY
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"

      - name: Push validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/tv-only-foundation
          echo "Validated final HEAD: $FINAL_HEAD"
