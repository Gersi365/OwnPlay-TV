name: Apply OwnPlay TV Settings integration

on:
  push:
    branches:
      - agent/settings-global-integration-no-apk
    paths:
      - .github/workflows/apply-settings-global-integration.yml

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Settings phase branch
        uses: actions/checkout@v6
        with:
          ref: agent/settings-global-integration-no-apk
          fetch-depth: 0

      - name: Verify authorized base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4360d77cfc2cc9793e3ef95c418405f1b558637d"
          git diff --quiet 4360d77cfc2cc9793e3ef95c418405f1b558637d HEAD^ -- app OwnPlay_TV_SOURCE.md OwnPlay_TV_UI_INTERACTION_CONTRACT.md OwnPlay_TV_ENGINEERING_WORKFLOW.md

      - name: Harden Settings and remove superseded Settings plumbing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          root = Path('app/src/main/java/app/ownplay/player/ui')

          # TvSettingsScreen: remove legacy unused shell callbacks and make focus requests frame-safe.
          path = root / 'TvSettingsScreen.kt'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import androidx.compose.runtime.setValue\n',
              'import androidx.compose.runtime.setValue\nimport androidx.compose.runtime.withFrameNanos\n',
              1,
          )
          text = text.replace('@Suppress("UNUSED_PARAMETER")\n', '', 1)
          old = '''    syncState: SourceSyncState,\n    activeSourceName: String?,\n    hasActivePlayback: Boolean,\n    onOpenLive: () -> Unit,\n    onOpenSourceInLive: (String) -> Unit,\n    onStopPlayback: () -> Unit,\n) {\n'''
          new = '''    syncState: SourceSyncState,\n    onOpenSourceInLive: (String) -> Unit,\n) {\n'''
          if text.count(old) != 1:
              raise RuntimeError('TvSettingsScreen legacy parameter block mismatch')
          text = text.replace(old, new, 1)
          old = '''    LaunchedEffect(page, lastRootDestination) {\n        if (page == TvSettingsPage.ROOT) {\n            rootFocusRequesters.getValue(lastRootDestination).requestFocus()\n        }\n    }\n'''
          new = '''    LaunchedEffect(page, lastRootDestination) {\n        if (page == TvSettingsPage.ROOT) {\n            withFrameNanos { }\n            rootFocusRequesters.getValue(lastRootDestination).requestFocus()\n        }\n    }\n'''
          if text.count(old) != 1:
              raise RuntimeError('Settings root focus effect mismatch')
          text = text.replace(old, new, 1)
          old = '''    LaunchedEffect(initialContentFocusRequester) {\n        (initialContentFocusRequester ?: backFocusRequester).requestFocus()\n    }\n'''
          new = '''    LaunchedEffect(initialContentFocusRequester) {\n        withFrameNanos { }\n        (initialContentFocusRequester ?: backFocusRequester).requestFocus()\n    }\n'''
          if text.count(old) != 1:
              raise RuntimeError('Settings information focus effect mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Shell: stop passing removed Settings-only legacy callbacks/state.
          path = root / 'TVOwnPlayApp.kt'
          text = path.read_text(encoding='utf-8')
          old = '''                    syncState = syncState,\n                    activeSourceName = activeSummary?.name,\n                    hasActivePlayback =\n                        activeSelection != null ||\n                            vodFullscreen ||\n                            seriesFullscreen,\n                    onOpenLive = { openSection(TVSection.LIVE) },\n                    onOpenSourceInLive = { sourceId ->\n'''
          new = '''                    syncState = syncState,\n                    onOpenSourceInLive = { sourceId ->\n'''
          if text.count(old) != 1:
              raise RuntimeError('TVOwnPlayApp Settings legacy args mismatch')
          text = text.replace(old, new, 1)
          old = '''                    },\n                    onStopPlayback = {\n                        if (activeSelection != null || fullscreenSelection != null) {\n                            stopLivePresentation {\n                                runtime.livePlaybackPresentationSession.clear()\n                            }\n                        } else {\n                            runtime.playbackController.stop()\n                            runtime.onDemandPresentationSession.clear()\n                        }\n                    },\n                )\n'''
          new = '''                    },\n                )\n'''
          if text.count(old) != 1:
              raise RuntimeError('TVOwnPlayApp Settings stop callback mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Playlists subpage: wait for content composition before requesting primary focus.
          path = root / 'SettingsPlaylist.kt'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import androidx.compose.runtime.remember\n',
              'import androidx.compose.runtime.remember\nimport androidx.compose.runtime.withFrameNanos\n',
              1,
          )
          old = '''    LaunchedEffect(focusPrimaryOnEntry) {\n        if (focusPrimaryOnEntry) {\n            contentFocusRequester.requestFocus()\n        }\n    }\n'''
          new = '''    LaunchedEffect(focusPrimaryOnEntry) {\n        if (focusPrimaryOnEntry) {\n            withFrameNanos { }\n            contentFocusRequester.requestFocus()\n        }\n    }\n'''
          if text.count(old) != 1:
              raise RuntimeError('Playlists entry focus effect mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Live Management: make primary focus deterministic after the source selector is composed.
          path = root / 'LiveManagementScreen.kt'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import androidx.compose.runtime.setValue\n',
              'import androidx.compose.runtime.setValue\nimport androidx.compose.runtime.withFrameNanos\n',
              1,
          )
          old = '''    LaunchedEffect(focusPrimaryOnEntry, selectedSourceId) {\n        if (focusPrimaryOnEntry) {\n            if (selectedSourceId == null) {\n                backFocusRequester.requestFocus()\n            } else {\n                primaryFocusRequester.requestFocus()\n            }\n        }\n    }\n'''
          new = '''    LaunchedEffect(focusPrimaryOnEntry, selectedSourceId) {\n        if (focusPrimaryOnEntry) {\n            withFrameNanos { }\n            if (selectedSourceId == null) {\n                backFocusRequester.requestFocus()\n            } else {\n                primaryFocusRequester.requestFocus()\n            }\n        }\n    }\n'''
          if text.count(old) != 1:
              raise RuntimeError('Live Management entry focus effect mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Backup & Restore: direct TV action language; persistence/format semantics stay unchanged.
          path = root / 'BackupRestoreSettingsContent.kt'
          text = path.read_text(encoding='utf-8')
          text = text.replace('title = "Backup personalization",', 'title = "Create backup",', 1)
          text = text.replace('actionLabel = "Export",', 'actionLabel = "Create",', 1)
          text = text.replace('title = "Restore personalization",', 'title = "Restore backup",', 1)
          text = text.replace('actionLabel = "Import",', 'actionLabel = "Restore",', 1)
          path.write_text(text, encoding='utf-8')

          # Remove superseded content-category Settings wrapper; keep About content.
          path = root / 'SettingsContent.kt'
          text = path.read_text(encoding='utf-8')
          text = text.replace('import app.ownplay.player.persistence.PlaylistSourceSummary\n', '')
          start = text.index('@Composable\ninternal fun ContentSettingsContent(')
          end = text.index('\n@Composable\ninternal fun AboutSettingsContent()', start)
          text = text[:start] + text[end+1:]
          path.write_text(text, encoding='utf-8')

          # Remove the superseded generic section wrapper; retain the active About/action-row primitives.
          path = root / 'SettingsComponents.kt'
          text = path.read_text(encoding='utf-8')
          text = text.replace('import androidx.compose.foundation.layout.size\n', '')
          text = text.replace('import androidx.compose.ui.graphics.vector.ImageVector\n', '')
          start = text.index('@Composable\ninternal fun CompactSettingsSection(')
          end = text.index('\n@Composable\ninternal fun SettingValueRow(', start)
          text = text[:start] + text[end+1:]
          path.write_text(text, encoding='utf-8')

          # Focused Settings/global integration regression contract.
          test = Path('app/src/test/java/app/ownplay/player/ui/TvSettingsIntegrationContractTest.kt')
          test.write_text('''package app.ownplay.player.ui\n\nimport app.ownplay.player.testing.sourceText\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass TvSettingsIntegrationContractTest {\n    private val settings = sourceText("src/main/java/app/ownplay/player/ui/TvSettingsScreen.kt")\n    private val shell = sourceText("src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt")\n    private val playlists = sourceText("src/main/java/app/ownplay/player/ui/SettingsPlaylist.kt")\n    private val liveManagement = sourceText("src/main/java/app/ownplay/player/ui/LiveManagementScreen.kt")\n    private val backup = sourceText("src/main/java/app/ownplay/player/ui/BackupRestoreSettingsContent.kt")\n    private val content = sourceText("src/main/java/app/ownplay/player/ui/SettingsContent.kt")\n    private val components = sourceText("src/main/java/app/ownplay/player/ui/SettingsComponents.kt")\n\n    @Test\n    fun `settings root remains the four direct TV destinations`() {\n        assertTrue(settings.contains("PLAYLISTS,\\n    LIVE_MANAGEMENT,\\n    BACKUP_RESTORE,\\n    ABOUT,"))\n        assertFalse(content.contains("ContentSettingsContent("))\n        assertFalse(components.contains("CompactSettingsSection("))\n    }\n\n    @Test\n    fun `settings no longer carries legacy playback and global navigation callbacks`() {\n        assertFalse(settings.contains("activeSourceName:"))\n        assertFalse(settings.contains("hasActivePlayback:"))\n        assertFalse(settings.contains("onOpenLive:"))\n        assertFalse(settings.contains("onStopPlayback:"))\n        assertFalse(shell.contains("activeSourceName = activeSummary?.name"))\n        assertFalse(shell.contains("onStopPlayback ="))\n        assertTrue(settings.contains("onOpenSourceInLive: (String) -> Unit"))\n    }\n\n    @Test\n    fun `settings focus restoration waits for composed TV targets`() {\n        assertTrue(settings.contains("withFrameNanos { }"))\n        assertTrue(settings.contains("rootFocusRequesters.getValue(lastRootDestination).requestFocus()"))\n        assertTrue(playlists.contains("withFrameNanos { }"))\n        assertTrue(liveManagement.contains("withFrameNanos { }"))\n    }\n\n    @Test\n    fun `backup restore exposes direct actions and excludes credentials`() {\n        assertTrue(backup.contains("title = \\\"Create backup\\\""))\n        assertTrue(backup.contains("actionLabel = \\\"Create\\\""))\n        assertTrue(backup.contains("title = \\\"Restore backup\\\""))\n        assertTrue(backup.contains("actionLabel = \\\"Restore\\\""))\n        assertTrue(backup.contains("credentials excluded"))\n        assertTrue(backup.contains("PersonalizationBackupService"))\n    }\n}\n''', encoding='utf-8')
          PY

          git diff --check
          ! grep -RInE 'ContentSettingsContent\(|CompactSettingsSection\(' app/src/main/java/app/ownplay/player/ui
          ! grep -nE 'activeSourceName:|hasActivePlayback:|onOpenLive:|onStopPlayback:' app/src/main/java/app/ownplay/player/ui/TvSettingsScreen.kt
          grep -Fq 'title = "Create backup"' app/src/main/java/app/ownplay/player/ui/BackupRestoreSettingsContent.kt
          grep -Fq 'title = "Restore backup"' app/src/main/java/app/ownplay/player/ui/BackupRestoreSettingsContent.kt
          grep -Fq 'rootFocusRequesters.getValue(lastRootDestination).requestFocus()' app/src/main/java/app/ownplay/player/ui/TvSettingsScreen.kt

      - name: Remove runner and create exact candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-settings-global-integration.yml
          git config user.name 'OwnPlay TV Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Settings focus and remove legacy settings plumbing'
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Validate exact Settings candidate without APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          gradle \
            :app:kspDebugKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:compileDebugAndroidTestKotlin \
            --stacktrace

      - name: Verify zero APK and Room stability
        shell: bash
        run: |
          set -euo pipefail
          count="$(find app/build -type f -name '*.apk' -print 2>/dev/null | tee /tmp/ownplay-tv-apks.txt | wc -l)"
          echo "APK artifacts: ${count}"
          test "$count" -eq 0
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path('app/schemas')
          generated = sorted(root.rglob('*.json'))
          problems = []
          if len(generated) != 6:
              problems.append(f'Expected 6 Room schemas, found {len(generated)}.')
          for path in generated:
              relative = path.as_posix()
              committed = subprocess.check_output(['git', 'show', f'HEAD:{relative}'], text=True)
              if json.loads(path.read_text(encoding='utf-8')) != json.loads(committed):
                  problems.append(f'Room schema drift: {relative}')
          if problems:
              print('\n'.join(problems))
              sys.exit(7)
          print('Validated 6 committed Room schema files.')
          PY
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"

      - name: Push validated Settings candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/settings-global-integration-no-apk
          echo "Validated final HEAD: $FINAL_HEAD"
