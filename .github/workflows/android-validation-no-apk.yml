name: OwnPlay TV Validation No APK

# Source/schema validation for OwnPlay TV. Never assemble, package, sign, or upload APKs.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - agent/tv-settings-tv-first-no-apk

permissions:
  contents: read

concurrency:
  group: ownplay-tv-validation-no-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tv-no-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify TV-only source boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d app/src/tv
          test -d app/src/main
          test ! -d app/src/mobile
          test ! -d app/src/testMobile
          grep -Fq 'applicationId = "app.ownplay.tv"' app/build.gradle.kts
          test -f app/src/tv/java/app/ownplay/player/ui/TvSettingsScreen.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Verify Android SDK 36
        shell: bash
        run: |
          test -d "${ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_HOME}/build-tools/36.0.0"

      - name: Validate TV without APK
        run: >-
          gradle
          :app:kspTvDebugKotlin
          :app:testTvDebugUnitTest
          :app:lintTvDebug
          :app:compileTvDebugAndroidTestKotlin
          --stacktrace

      - name: Verify no APK was produced
        shell: bash
        run: |
          set -euo pipefail
          count="$(find app/build -type f -name '*.apk' -print 2>/dev/null | tee /tmp/ownplay-tv-apks.txt | wc -l)"
          echo "APK artifacts: ${count}"
          if [ "${count}" -ne 0 ]; then
            cat /tmp/ownplay-tv-apks.txt >&2
            exit 1
          fi

      - name: Verify Room schema is unchanged and committed
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path('app/schemas')
          problems = []
          generated = sorted(root.rglob('*.json'))
          if not generated:
              problems.append('No Room schema JSON generated.')

          for path in generated:
              relative = path.as_posix()
              try:
                  committed_text = subprocess.check_output(
                      ['git', 'show', f'HEAD:{relative}'],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  problems.append(f'Uncommitted Room schema: {relative}')
                  continue

              try:
                  generated_json = json.loads(path.read_text(encoding='utf-8'))
                  committed_json = json.loads(committed_text)
              except json.JSONDecodeError as error:
                  problems.append(f'Invalid Room schema JSON in {relative}: {error}')
                  continue

              if generated_json != committed_json:
                  problems.append(f'Room schema drift: {relative}')

          committed_paths = subprocess.check_output(
              ['git', 'ls-tree', '-r', '--name-only', 'HEAD', 'app/schemas'],
              text=True,
          ).splitlines()
          for relative in committed_paths:
              if relative.endswith('.json') and not pathlib.Path(relative).is_file():
                  problems.append(f'Committed Room schema missing from generated output: {relative}')

          if problems:
              print('\n'.join(problems))
              sys.exit(2)
          PY

      - name: Upload Room schema evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-tv-room-schema-no-apk
          path: app/schemas
          if-no-files-found: error
          retention-days: 7
