name: OwnPlay TV Visual Prototype Screenshots

on:
  push:
    branches:
      - 'agent/tv-restructure-visual-prototype'
    paths:
      - 'app/src/tvDebug/**'
      - 'tools/apply_tv_visual_left_rail_provider_categories.py'
      - 'tools/capture_tv_visual_prototype.sh'
      - '.github/workflows/tv-visual-prototype-screenshots.yml'

permissions:
  contents: read

concurrency:
  group: ownplay-tv-visual-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact prototype HEAD
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          fi

      - name: Apply approved visual prototype decisions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_tv_visual_left_rail_provider_categories.py
          grep -q 'private fun PrimaryRail' app/src/tvDebug/java/app/ownplay/player/prototype/TvVisualPrototypeScreens.kt
          ! grep -q 'Nav("Live"' app/src/tvDebug/java/app/ownplay/player/prototype/TvVisualPrototypeScreens.kt
          ! grep -Eq '\bAll\b' app/src/tvDebug/java/app/ownplay/player/prototype/TvVisualPrototypeScreens.kt

      - name: Build authorized emulator QA APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleTvDebug --stacktrace
          apk="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "${apk}"
          echo "QA APK: ${apk}"
          echo "QA_APK=${apk}" >> "${GITHUB_ENV}"

      - name: Capture 1920x1080 OwnPlay TV screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/capture_tv_visual_prototype.sh

      - name: Verify screenshot evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import struct

          root = pathlib.Path('prototype-screenshots')
          images = sorted(root.glob('*.png'))
          if len(images) != 16:
              raise SystemExit(f'Expected 16 screenshots, found {len(images)}')

          for image in images:
              data = image.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Invalid PNG: {image}')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (1920, 1080):
                  raise SystemExit(f'Unexpected dimensions for {image}: {width}x{height}')
              print(f'{image.name}: {width}x{height} ({len(data)} bytes)')
          PY

      - name: Upload screenshot set only
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-tv-restructure-visual-prototype
          path: prototype-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
