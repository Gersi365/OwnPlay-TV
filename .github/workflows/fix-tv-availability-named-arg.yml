name: Fix TV availability named argument

on:
  push:
    branches:
      - agent/tv-settings-tv-first-no-apk

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/tv-settings-tv-first-no-apk
          fetch-depth: 1

      - name: Fix named argument and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/tv/java/app/ownplay/player/ui/TVOwnPlayApp.kt')
          text = path.read_text(encoding='utf-8')
          old = '            availableSourceIds = availableSourceIds,\n'
          new = '            enabledSourceIds = availableSourceIds,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one named-argument match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-tv-availability-named-arg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No fix changes produced" >&2; exit 1; }
          git commit -m "Fix TV availability source resolution call"
          git push origin HEAD:agent/tv-settings-tv-first-no-apk
