name: Fix TV playlist action focus state

on:
  push:
    branches:
      - agent/tv-playlists-remote-actions-no-apk

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/tv-playlists-remote-actions-no-apk
          fetch-depth: 1

      - name: Preserve focus visual state across action label changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('app/src/main/java/app/ownplay/player/ui/PlaylistSettingsScreen.kt')
          text = source.read_text(encoding='utf-8')
          old = 'var focused by remember(title, enabled) { mutableStateOf(false) }'
          new = 'var focused by remember { mutableStateOf(false) }'
          if text.count(old) != 1:
              raise SystemExit(f'focus state pattern count: {text.count(old)}')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('app/src/test/java/app/ownplay/player/ui/TvPlaylistRemoteActionsContractTest.kt')
          text = test.read_text(encoding='utf-8')
          marker = '        assertTrue(playlistSource.contains(".onFocusChanged { focused = it.isFocused }"))\n'
          addition = (
              marker
              + '        assertTrue(playlistSource.contains("var focused by remember { mutableStateOf(false) }"))\n'
              + '        assertFalse(playlistSource.contains("remember(title, enabled)"))\n'
          )
          if text.count(marker) != 1:
              raise SystemExit(f'test marker count: {text.count(marker)}')
          test.write_text(text.replace(marker, addition, 1), encoding='utf-8')
          PY

          rm .github/workflows/fix-tv-playlist-focus-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/ownplay/player/ui/PlaylistSettingsScreen.kt
          git add app/src/test/java/app/ownplay/player/ui/TvPlaylistRemoteActionsContractTest.kt
          git add -u .github/workflows
          git diff --cached --check
          git commit -m 'Preserve TV playlist action focus visual state'
          git push origin HEAD:agent/tv-playlists-remote-actions-no-apk
