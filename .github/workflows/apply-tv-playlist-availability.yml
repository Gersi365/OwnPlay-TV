name: Apply TV playlist availability patch

on:
  push:
    branches:
      - agent/tv-settings-tv-first-no-apk

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: agent/tv-settings-tv-first-no-apk
          fetch-depth: 1

      - name: Apply deterministic source patch
        run: python3 tools/apply_tv_playlist_availability.py

      - name: Commit source patch and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_tv_playlist_availability.py
          rm .github/workflows/apply-tv-playlist-availability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No patch changes produced" >&2; exit 1; }
          git commit -m "Add TV playlist availability controls"
          git push origin HEAD:agent/tv-settings-tv-first-no-apk
