name: Apply TV-only form factor cleanup

on:
  push:
    branches:
      - agent/tv-only-form-factor-cleanup-no-apk

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/tv-only-form-factor-cleanup-no-apk
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Apply deterministic cleanup
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/if 'isTelevision' in live or 'isLandscape' in live or 'Portrait' in live:/if 'val isTelevision' in live or 'isLandscape' in live or 'Portrait' in live:/" tools/apply_tv_only_form_factor_cleanup.py
          python3 tools/apply_tv_only_form_factor_cleanup.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          hierarchy_path = Path('app/src/main/java/app/ownplay/player/ui/live/LiveBrowseHierarchy.kt')
          hierarchy = hierarchy_path.read_text(encoding='utf-8')
          hierarchy = hierarchy.replace('import android.content.res.Configuration\n', '')
          hierarchy = hierarchy.replace('import androidx.compose.ui.platform.LocalConfiguration\n', '')
          hierarchy = hierarchy.replace(
              ' * [LiveBrowseHierarchyPolicy] and is applied by LiveRoute. Non-TV callers remain on the established\n * browse behavior and do not receive TV focus fallback semantics.\n',
              ' * [LiveBrowseHierarchyPolicy] and is applied by LiveRoute.\n',
          )
          hierarchy = replace_once(
              hierarchy,
              '''    val configuration = LocalConfiguration.current\n    val isTelevision =\n        configuration.uiMode and Configuration.UI_MODE_TYPE_MASK == Configuration.UI_MODE_TYPE_TELEVISION\n    val useTvFocusFallback = isTelevision && channelFocusRequester != null\n''',
              '    val useTvFocusFallback = channelFocusRequester != null\n',
              'hierarchy TV-only focus fallback',
          )
          hierarchy = hierarchy.replace('PortraitLiveBrowseWithViewModes(', 'TvLiveBrowseWithViewModes(')
          hierarchy = hierarchy.replace('showCategoryStrip = !isTelevision,', 'showCategoryStrip = false,')
          hierarchy = replace_once(
              hierarchy,
              '''    val configuration = LocalConfiguration.current\n    val isTelevision =\n        configuration.uiMode and Configuration.UI_MODE_TYPE_MASK == Configuration.UI_MODE_TYPE_TELEVISION\n''',
              '',
              'category TV-only configuration',
          )
          hierarchy = hierarchy.replace(
              '''    LaunchedEffect(\n        isTelevision,\n        preferredCategoryKey,\n        preferredCategoryIndex,\n        state.categories,\n    ) {\n        if (!isTelevision || preferredCategoryKey == null || preferredCategoryIndex < 0) {\n''',
              '''    LaunchedEffect(\n        preferredCategoryKey,\n        preferredCategoryIndex,\n        state.categories,\n    ) {\n        if (preferredCategoryKey == null || preferredCategoryIndex < 0) {\n''',
          )
          if 'isTelevision' in hierarchy or 'Portrait' in hierarchy or 'LocalConfiguration' in hierarchy:
              raise RuntimeError('LiveBrowseHierarchy still contains form-factor branching')
          hierarchy_path.write_text(hierarchy, encoding='utf-8')

          original = subprocess.check_output(
              ['git', 'show', 'HEAD:app/src/main/java/app/ownplay/player/ui/live/PortraitLiveViewModes.kt'],
              text=True,
          )
          view_modes = original.replace('import android.content.res.Configuration\n', '')
          view_modes = view_modes.replace('import androidx.compose.ui.platform.LocalConfiguration\n', '')
          view_modes = view_modes.replace('PortraitLiveBrowseWithViewModes', 'TvLiveBrowseWithViewModes')
          form_factor_block = '''    val configuration = LocalConfiguration.current\n    val isTelevision =\n        configuration.uiMode and Configuration.UI_MODE_TYPE_MASK == Configuration.UI_MODE_TYPE_TELEVISION\n'''
          if view_modes.count(form_factor_block) != 2:
              raise RuntimeError(
                  f'view modes TV-only configuration: expected two matches, found {view_modes.count(form_factor_block)}',
              )
          view_modes = view_modes.replace(form_factor_block, '', 1)
          view_modes = view_modes.replace(
              '''    LaunchedEffect(searchExpanded, isTelevision) {\n        if (!isTelevision || !searchExpanded) return@LaunchedEffect\n''',
              '''    LaunchedEffect(searchExpanded) {\n        if (!searchExpanded) return@LaunchedEffect\n''',
          )
          view_modes = view_modes.replace(
              '''    LaunchedEffect(playingChannelId, isTelevision) {\n        if (isTelevision && playingChannelId != null) {\n''',
              '''    LaunchedEffect(playingChannelId) {\n        if (playingChannelId != null) {\n''',
          )
          view_modes = view_modes.replace(
              'enabled = isTelevision && searchExpanded && playingChannelId == null,',
              'enabled = searchExpanded && playingChannelId == null,',
          )
          view_modes = view_modes.replace('tvFocusManagement = isTelevision,', 'tvFocusManagement = true,')
          view_modes = replace_once(
              view_modes,
              '''                modifier = Modifier\n                    .fillMaxWidth()\n                    .padding(horizontal = 14.dp, vertical = 6.dp)\n                    .then(\n                        if (isTelevision) {\n                            Modifier\n                                .focusRequester(searchFieldFocusRequester)\n                                .onPreviewKeyEvent { event ->\n                                    when {\n                                        event.type == KeyEventType.KeyDown &&\n                                            event.key == Key.DirectionUp -> {\n                                            searchTriggerFocusRequester.requestFocus()\n                                            true\n                                        }\n                                        event.type == KeyEventType.KeyDown &&\n                                            event.key == Key.DirectionDown &&\n                                            state.channels.isNotEmpty() &&\n                                            channelFocusRequester != null -> {\n                                            channelFocusRequester.requestFocus()\n                                            true\n                                        }\n                                        else -> false\n                                    }\n                                }\n                        } else {\n                            Modifier\n                        },\n                    ),\n''',
              '''                modifier = Modifier\n                    .fillMaxWidth()\n                    .padding(horizontal = 14.dp, vertical = 6.dp)\n                    .focusRequester(searchFieldFocusRequester)\n                    .onPreviewKeyEvent { event ->\n                        when {\n                            event.type == KeyEventType.KeyDown && event.key == Key.DirectionUp -> {\n                                searchTriggerFocusRequester.requestFocus()\n                                true\n                            }\n                            event.type == KeyEventType.KeyDown &&\n                                event.key == Key.DirectionDown &&\n                                state.channels.isNotEmpty() &&\n                                channelFocusRequester != null -> {\n                                channelFocusRequester.requestFocus()\n                                true\n                            }\n                            else -> false\n                        }\n                    },\n''',
              'search field TV-only focus modifier',
          )
          view_modes = replace_once(
              view_modes,
              form_factor_block + '    val cardMinSize = if (isTelevision) 176.dp else 156.dp\n',
              '    val cardMinSize = 176.dp\n',
              'channel cards TV-only size',
          )
          if 'isTelevision' in view_modes or 'Portrait' in view_modes or 'LocalConfiguration' in view_modes or 'Configuration.ORIENTATION_' in view_modes:
              raise RuntimeError('TV Live view modes still contain form-factor branching')
          Path('app/src/main/java/app/ownplay/player/ui/live/TvLiveViewModes.kt').write_text(
              view_modes,
              encoding='utf-8',
          )

          # Live fullscreen entry reasons existed only to distinguish user entry from rotation entry.
          # TV has no rotation-driven fullscreen, so session state only needs Preview/Fullscreen.
          session_path = Path('app/src/main/java/app/ownplay/player/playback/LivePlaybackPresentationSession.kt')
          session = session_path.read_text(encoding='utf-8')
          session = replace_once(
              session,
              '    val fullscreenEntryReason: LiveFullscreenEntryReason? = null,\n',
              '',
              'remove fullscreen entry reason state',
          )
          session = replace_once(
              session,
              '''        require(surface == LivePlaybackPresentationSurface.FULLSCREEN || fullscreenEntryReason == null) {\n            "Fullscreen entry reason is only valid for fullscreen presentation"\n        }\n''',
              '',
              'remove fullscreen reason invariant',
          )
          session = replace_once(
              session,
              '''    fun showFullscreen(\n        selection: LivePlaybackSelection,\n        entryReason: LiveFullscreenEntryReason? = null,\n    ) {\n''',
              '    fun showFullscreen(selection: LivePlaybackSelection) {\n',
              'simplify fullscreen session API',
          )
          session = replace_once(
              session,
              '            fullscreenEntryReason = entryReason,\n',
              '',
              'remove fullscreen reason assignment',
          )
          if 'LiveFullscreenEntryReason' in session or 'fullscreenEntryReason' in session:
              raise RuntimeError('Live session still contains rotation entry metadata')
          session_path.write_text(session, encoding='utf-8')

          Path('app/src/test/java/app/ownplay/player/playback/LivePlaybackPresentationSessionTest.kt').write_text('''package app.ownplay.player.playback\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertNull\nimport org.junit.Test\n\nclass LivePlaybackPresentationSessionTest {\n    @Test\n    fun previewStateIsRetainedUntilExplicitlyChanged() {\n        val session = LivePlaybackPresentationSession()\n        val selection = selection(channelId = "one")\n\n        session.showPreview(selection)\n\n        assertEquals(selection, session.state.value.selection)\n        assertEquals(LivePlaybackPresentationSurface.PREVIEW, session.state.value.surface)\n        assertNull(session.state.value.fullscreenSelection)\n    }\n\n    @Test\n    fun fullscreenStateIsRetainedUntilExplicitlyChanged() {\n        val session = LivePlaybackPresentationSession()\n        val selection = selection(channelId = "one")\n\n        session.showFullscreen(selection)\n\n        assertEquals(selection, session.state.value.fullscreenSelection)\n        assertEquals(LivePlaybackPresentationSurface.FULLSCREEN, session.state.value.surface)\n    }\n\n    @Test\n    fun navigationReplacesSelectionWithoutChangingPresentation() {\n        val session = LivePlaybackPresentationSession()\n        session.showFullscreen(selection(channelId = "one"))\n        val next = selection(channelId = "two")\n\n        session.replaceSelection(next)\n\n        assertEquals(next, session.state.value.selection)\n        assertEquals(LivePlaybackPresentationSurface.FULLSCREEN, session.state.value.surface)\n    }\n\n    @Test\n    fun returningToPreviewKeepsSelectionAndChangesSurface() {\n        val session = LivePlaybackPresentationSession()\n        val selection = selection(channelId = "one")\n        session.showFullscreen(selection)\n\n        session.showPreview(selection)\n\n        assertEquals(selection, session.state.value.selection)\n        assertEquals(LivePlaybackPresentationSurface.PREVIEW, session.state.value.surface)\n    }\n\n    @Test\n    fun clearRemovesTransientPresentation() {\n        val session = LivePlaybackPresentationSession()\n        session.showPreview(selection(channelId = "one"))\n\n        session.clear()\n\n        assertNull(session.state.value.selection)\n        assertNull(session.state.value.surface)\n    }\n\n    private fun selection(channelId: String): LivePlaybackSelection = LivePlaybackSelection(\n        request = PlaybackRequest(\n            sourceId = "source",\n            channelId = channelId,\n        ),\n        displayName = "Channel $channelId",\n    )\n}\n''', encoding='utf-8')

          # Series catalog focus is always TV focus; remove the remaining device-type probe.
          series_path = Path('app/src/main/java/app/ownplay/player/ui/series/SeriesRoute.kt')
          series = series_path.read_text(encoding='utf-8')
          series_tv_block = '''    val configuration = LocalConfiguration.current\n    val isTelevision =\n        configuration.uiMode and Configuration.UI_MODE_TYPE_MASK == Configuration.UI_MODE_TYPE_TELEVISION\n'''
          series = replace_once(series, series_tv_block, '', 'Series catalog TV probe')
          series = replace_once(
              series,
              '    LaunchedEffect(isTelevision, restoreFocusOnEntry, focusCategoryKey) {\n',
              '    LaunchedEffect(restoreFocusOnEntry, focusCategoryKey) {\n',
              'Series TV focus effect',
          )
          series = replace_once(
              series,
              '        if (isTelevision && restoreFocusOnEntry) {\n',
              '        if (restoreFocusOnEntry) {\n',
              'Series TV focus condition',
          )
          if 'isTelevision' in series or 'LocalConfiguration' in series or 'UI_MODE_TYPE_TELEVISION' in series:
              raise RuntimeError('SeriesRoute still contains device-type probing')
          series_path.write_text(series, encoding='utf-8')

          # VOD category and playback focus are always remote-first. Remove TV detection and touch wake.
          vod_path = Path('app/src/main/java/app/ownplay/player/ui/vod/VodRoute.kt')
          vod = vod_path.read_text(encoding='utf-8')
          vod = vod.replace('import androidx.compose.foundation.gestures.detectTapGestures\n', '')
          vod = vod.replace('import androidx.compose.ui.input.pointer.pointerInput\n', '')
          vod_tv_block = '''    val configuration = LocalConfiguration.current\n    val isTelevision =\n        configuration.uiMode and android.content.res.Configuration.UI_MODE_TYPE_MASK ==\n            android.content.res.Configuration.UI_MODE_TYPE_TELEVISION\n'''
          if vod.count(vod_tv_block) != 2:
              raise RuntimeError(f'VOD TV probe: expected two matches, found {vod.count(vod_tv_block)}')
          vod = vod.replace(vod_tv_block, '', 2)
          vod = replace_once(
              vod,
              '    LaunchedEffect(isTelevision, restoreFocusOnEntry, focusCategoryKey) {\n',
              '    LaunchedEffect(restoreFocusOnEntry, focusCategoryKey) {\n',
              'VOD category focus effect',
          )
          vod = replace_once(
              vod,
              '        if (isTelevision && focusCategoryKey != null) {\n',
              '        if (focusCategoryKey != null) {\n',
              'VOD category focus condition',
          )
          vod = replace_once(
              vod,
              '''    LaunchedEffect(isTelevision, controlsVisible, playbackState, movie.movieId) {\n        if (!isTelevision) return@LaunchedEffect\n''',
              '    LaunchedEffect(controlsVisible, playbackState, movie.movieId) {\n',
              'VOD playback focus effect',
          )
          vod = replace_once(
              vod,
              '    val remoteWakeModifier = if (isTelevision && !controlsVisible) {\n',
              '    val remoteWakeModifier = if (!controlsVisible) {\n',
              'VOD remote wake condition',
          )
          vod = replace_once(
              vod,
              '''                    if (\n                        isTelevision &&\n                        controlsVisible &&\n                        event.nativeKeyEvent.isRemoteNavigationKeyDown()\n                    ) {\n''',
              '''                    if (\n                        controlsVisible &&\n                        event.nativeKeyEvent.isRemoteNavigationKeyDown()\n                    ) {\n''',
              'VOD remote interaction condition',
          )
          vod = replace_once(
              vod,
              '''            Box(\n                modifier = Modifier\n                    .fillMaxSize()\n                    .pointerInput(movie.movieId, controlsVisible) {\n                        detectTapGestures {\n                            if (controlsVisible) {\n                                controlsVisible = false\n                            } else {\n                                revealControls()\n                            }\n                        }\n                    }\n                    .then(remoteWakeModifier),\n            )\n''',
              '''            Box(\n                modifier = Modifier\n                    .fillMaxSize()\n                    .then(remoteWakeModifier),\n            )\n''',
              'remove VOD touch wake surface',
          )
          if any(token in vod for token in ('isTelevision', 'LocalConfiguration', 'UI_MODE_TYPE_TELEVISION', 'detectTapGestures', 'pointerInput')):
              raise RuntimeError('VodRoute still contains device-type or touch-only probing')
          vod_path.write_text(vod, encoding='utf-8')
          PY
          rm tools/apply_tv_only_form_factor_cleanup.py
          rm .github/workflows/apply-tv-only-form-factor-cleanup.yml
          git diff --check
          test ! -d app/src/tv
          test ! -d app/src/mobile
          test ! -d app/src/testMobile
          grep -Fq 'applicationId = "app.ownplay.tv"' app/build.gradle.kts
          test -f app/src/main/java/app/ownplay/player/ui/TVOwnPlayApp.kt
          test -f app/src/main/java/app/ownplay/player/ui/TvSettingsScreen.kt
          test -f app/src/main/java/app/ownplay/player/ui/live/TvLiveViewModes.kt
          if grep -RInE 'create\("mobile"\)|app\.ownplay\.mobile|IS_TV_BUILD|TARGET_DEVICE|AppDeviceProfile|AppOrientation|SMARTPHONE|TOUCHSCREEN|PORTRAIT|PortraitLive|SettingsLandscape|PictureInPicture|rotationFullscreen|GestureDetector|dispatchTouchEvent' app/src app/build.gradle.kts; then
            echo 'Forbidden mobile/form-factor residue remains.' >&2
            exit 2
          fi
          if grep -RInE 'Configuration\.ORIENTATION_(LANDSCAPE|PORTRAIT)|isLandscape|isPortrait|UI_MODE_TYPE_TELEVISION|val isTelevision' app/src/main/java; then
            echo 'Forbidden runtime form-factor/orientation branching remains.' >&2
            exit 3
          fi

      - name: Validate single TV variant without APK
        run: >-
          gradle
          :app:kspDebugKotlin
          :app:testDebugUnitTest
          :app:lintDebug
          :app:compileDebugAndroidTestKotlin
          --stacktrace

      - name: Verify no APK and Room schema
        shell: bash
        run: |
          set -euo pipefail
          count="$(find app/build -type f -name '*.apk' -print 2>/dev/null | wc -l)"
          echo "APK artifacts: ${count}"
          test "${count}" -eq 0
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          root = pathlib.Path('app/schemas')
          problems = []
          generated = sorted(root.rglob('*.json'))
          if not generated:
              problems.append('No Room schema JSON generated.')
          for path in generated:
              relative = path.as_posix()
              try:
                  committed = subprocess.check_output(['git', 'show', f'HEAD:{relative}'], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  problems.append(f'Uncommitted Room schema: {relative}')
                  continue
              if json.loads(path.read_text(encoding='utf-8')) != json.loads(committed):
                  problems.append(f'Room schema drift: {relative}')
          if problems:
              print('\n'.join(problems))
              sys.exit(4)
          PY

      - name: Commit TV-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make OwnPlay project TV-only'
          git push origin HEAD:agent/tv-only-form-factor-cleanup-no-apk
